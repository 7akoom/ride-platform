services:
  identity-postgres:
    image: postgres:17-alpine3.24
    container_name: ride-identity-postgres

    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:?IDENTITY_DB_NAME is required}
      POSTGRES_USER: ${IDENTITY_DB_USER:?IDENTITY_DB_USER is required}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}

    ports:
      - "5433:5432"

    volumes:
      - identity-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${IDENTITY_DB_USER} -d ${IDENTITY_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  identity-valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    container_name: ride-identity-valkey

    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}

    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - identity-valkey-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

volumes:
  identity-postgres-data:
  identity-valkey-data: