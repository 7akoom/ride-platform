      POSTGRES_DB: ${STAFF_DB_NAME:?STAFF_DB_NAME is required}
      POSTGRES_USER: ${STAFF_DB_USER:?STAFF_DB_USER is required}
      POSTGRES_PASSWORD: ${STAFF_DB_PASSWORD:?STAFF_DB_PASSWORD is required}

    ports:
