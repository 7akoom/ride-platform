    container_name: ride-media-postgres

    environment:
      POSTGRES_DB: ${MEDIA_DB_NAME:?MEDIA_DB_NAME is required}
      POSTGRES_USER: ${MEDIA_DB_USER:?MEDIA_DB_USER is required}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD:?MEDIA_DB_PASSWORD is required}

    ports:
      - "127.0.0.1:5443:5432"

    volumes:
      - media-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MEDIA_DB_USER} -d ${MEDIA_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  # Object store for uploaded files (S3 API on 127.0.0.1:8333). The apps send
  # and read files here directly with URLs media-service signs; the S3 API
  # refuses anything unsigned. In production put it behind the HTTPS proxy
  # (passing the Host header unchanged) and set S3_PUBLIC_ENDPOINT to that
  # address. -volume.max=0 lets volumes grow with the disk.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: ride-seaweedfs

    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}

    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"media-service","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 \
          -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json

    ports:
      - "127.0.0.1:8333:8333"

    volumes:
      - seaweedfs-data:/data

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  # Road routing for pricing-service. Requires a one-time dataset build:
  # see infrastructure/osrm/README.md. Starts only once that's done.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: ride-osrm

    command: >
      osrm-routed --algorithm mld
      /data/${OSRM_DATASET_NAME:?OSRM_DATASET_NAME is required - run infrastructure/osrm/prepare-osrm-data.sh first}.osrm

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - ../osrm/data:/data:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:5000/route/v1/driving/0,0;0,0' >/dev/null 2>&1 || exit 0",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  identity-valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    container_name: ride-identity-valkey

    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}

    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - identity-valkey-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  location-valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    container_name: ride-location-valkey

    environment:
      LOCATION_VALKEY_PASSWORD: ${LOCATION_VALKEY_PASSWORD:?LOCATION_VALKEY_PASSWORD is required}

    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --requirepass "$$LOCATION_VALKEY_PASSWORD"

    ports:
      - "127.0.0.1:6381:6379"

    volumes:
      - location-valkey-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli -a "$$LOCATION_VALKEY_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  nats:
    image: nats:2.14.5-alpine3.22
    container_name: ride-nats

    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"

    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

    volumes:
      - nats-jetstream-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  nats-bootstrap:
    image: natsio/nats-box:0.19.7
    container_name: ride-nats-bootstrap

    depends_on:
      nats:
        condition: service_healthy

    environment:
      NATS_URL: nats://nats:4222
      STREAM_NAME: IDENTITY_EVENTS
      STREAM_CONFIG: /streams/identity-events.json

    volumes:
      - ./nats/bootstrap.sh:/bootstrap.sh:ro
      - ./nats/streams:/streams:ro

    command:
      - /bin/sh
      - /bootstrap.sh

    restart: "no"

  rider-nats-bootstrap:
    image: natsio/nats-box:0.19.7
    container_name: ride-rider-nats-bootstrap

    depends_on:
      nats:
        condition: service_healthy

    environment:
      NATS_URL: nats://nats:4222
      STREAM_NAME: RIDER_EVENTS
      STREAM_CONFIG: /streams/rider-events.json

    volumes:
      - ./nats/bootstrap.sh:/bootstrap.sh:ro
      - ./nats/streams:/streams:ro

    command:
      - /bin/sh
      - /bootstrap.sh

    restart: "no"

  driver-nats-bootstrap:
    image: natsio/nats-box:0.19.7
    container_name: ride-driver-nats-bootstrap

    depends_on:
      nats:
        condition: service_healthy

    environment:
      NATS_URL: nats://nats:4222
      STREAM_NAME: DRIVER_EVENTS
      STREAM_CONFIG: /streams/driver-events.json

    volumes:
      - ./nats/bootstrap.sh:/bootstrap.sh:ro
      - ./nats/streams:/streams:ro

    command:
      - /bin/sh
      - /bootstrap.sh

    restart: "no"

  trip-nats-bootstrap:
    image: natsio/nats-box:0.19.7
    container_name: ride-trip-nats-bootstrap

    depends_on:
      nats:
        condition: service_healthy

    environment:
      NATS_URL: nats://nats:4222
      STREAM_NAME: TRIP_EVENTS
      STREAM_CONFIG: /streams/trip-events.json

    volumes:
      - ./nats/bootstrap.sh:/bootstrap.sh:ro
      - ./nats/streams:/streams:ro

    command:
      - /bin/sh
      - /bootstrap.sh

    restart: "no"

  pricing-nats-bootstrap:
    image: natsio/nats-box:0.19.7
    container_name: ride-pricing-nats-bootstrap

    depends_on:
      nats:
        condition: service_healthy

    environment:
      NATS_URL: nats://nats:4222
      STREAM_NAME: PRICING_EVENTS
      STREAM_CONFIG: /streams/pricing-events.json

    volumes:
      - ./nats/bootstrap.sh:/bootstrap.sh:ro
      - ./nats/streams:/streams:ro

    command:
      - /bin/sh
      - /bootstrap.sh

    restart: "no"

  # --- Application services -------------------------------------------
  #
  # Each reuses its own services/<name>/.env for everything that doesn't
  # change between "go run on the host" and "container on this network"
  # (tokens, rate limits, issuer/audience/key ID) — env_file loads that
  # file first, then the environment: block below overrides only the
  # handful of values that DO change: DATABASE_URL/VALKEY_ADDRESS/
  # NATS_URL (container hostnames, not localhost) and peer
  # *_SERVICE_ADDRESS vars (dispatch/pricing/notification calling their
  # peers by container hostname too).
  #
  # The access-token public key is mounted read-only into every service
  # from identity-service's own .local/keys — copy it there first the
  # same way you already do for local (non-container) runs.

  identity-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: identity-service
    image: ride-platform/identity-service:dev
    container_name: ride-identity-service

    env_file:
      - ../../services/identity-service/.env

    environment:
      GRPC_ADDRESS: ":50051"
      METRICS_ADDRESS: ":9090"
      DATABASE_URL: postgres://${IDENTITY_DB_USER}:${IDENTITY_DB_PASSWORD}@identity-postgres:5432/${IDENTITY_DB_NAME}?sslmode=disable
      VALKEY_ADDRESS: identity-valkey:6379
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.0/8

    volumes:
      - ../../services/identity-service/.local/keys:/app/.local/keys:ro

    depends_on:
      identity-postgres:
        condition: service_healthy
      identity-valkey:
        condition: service_healthy

    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:9090:9090"

    restart: unless-stopped

  rider-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: rider-service
    image: ride-platform/rider-service:dev
    container_name: ride-rider-service

    env_file:
      - ../../services/rider-service/.env

    environment:
      GRPC_ADDRESS: ":50052"
      METRICS_ADDRESS: ":9092"
      DATABASE_URL: postgres://${RIDER_DB_USER}:${RIDER_DB_PASSWORD}@rider-postgres:5432/${RIDER_DB_NAME}?sslmode=disable
      NATS_URL: nats://nats:4222
      MEDIA_SERVICE_ADDRESS: media-service:50062

    volumes:
      - ../../services/identity-service/.local/keys/access_token_public.pem:/app/.local/keys/access_token_public.pem:ro

    depends_on:
      rider-postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      media-service:
        condition: service_started

    ports:
      - "127.0.0.1:50052:50052"
      - "127.0.0.1:9092:9092"

    restart: unless-stopped

  driver-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: driver-service
    image: ride-platform/driver-service:dev
    container_name: ride-driver-service

    env_file:
      - ../../services/driver-service/.env

    environment:
      GRPC_ADDRESS: ":50053"
      METRICS_ADDRESS: ":9093"
      DATABASE_URL: postgres://${DRIVER_DB_USER}:${DRIVER_DB_PASSWORD}@driver-postgres:5432/${DRIVER_DB_NAME}?sslmode=disable
      NATS_URL: nats://nats:4222
      STAFF_SERVICE_ADDRESS: staff-service:50061

    volumes:
      - ../../services/identity-service/.local/keys/access_token_public.pem:/app/.local/keys/access_token_public.pem:ro

    depends_on:
      driver-postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      staff-service:
        condition: service_started

    ports:
      - "127.0.0.1:50053:50053"
      - "127.0.0.1:9093:9093"

    restart: unless-stopped

  location-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: location-service
    image: ride-platform/location-service:dev
    container_name: ride-location-service

    env_file:
      - ../../services/location-service/.env

    environment:
      OSRM_BASE_URL: http://osrm:5000
      NOMINATIM_BASE_URL: http://nominatim:8080
      GRPC_ADDRESS: ":50054"
      METRICS_ADDRESS: ":9094"
      VALKEY_ADDRESS: location-valkey:6379
      VALKEY_PASSWORD: ${LOCATION_VALKEY_PASSWORD}
      DATABASE_URL: postgres://${LOCATION_DB_USER}:${LOCATION_DB_PASSWORD}@location-postgres:5432/${LOCATION_DB_NAME}?sslmode=disable
      RIDER_SERVICE_ADDRESS: rider-service:50052
      DRIVER_SERVICE_ADDRESS: driver-service:50053
      STAFF_SERVICE_ADDRESS: staff-service:50061

    volumes:
      - ../../services/identity-service/.local/keys/access_token_public.pem:/app/.local/keys/access_token_public.pem:ro

    depends_on:
      location-valkey:
        condition: service_healthy
      location-postgres:
        condition: service_healthy
      rider-service:
        condition: service_started
      driver-service:
        condition: service_started
      staff-service:
        condition: service_started

    ports:
      - "127.0.0.1:50054:50054"
      - "127.0.0.1:9094:9094"

    restart: unless-stopped

  trip-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: trip-service
    image: ride-platform/trip-service:dev
    container_name: ride-trip-service

    env_file:
      - ../../services/trip-service/.env

    environment:
      GRPC_ADDRESS: ":50055"
      METRICS_ADDRESS: ":9095"
      DATABASE_URL: postgres://${TRIP_DB_USER}:${TRIP_DB_PASSWORD}@trip-postgres:5432/${TRIP_DB_NAME}?sslmode=disable
      NATS_URL: nats://nats:4222
      LOCATION_SERVICE_ADDRESS: location-service:50054
      RIDER_SERVICE_ADDRESS: rider-service:50052
      DRIVER_SERVICE_ADDRESS: driver-service:50053
      MEDIA_SERVICE_ADDRESS: media-service:50062

    volumes:
      - ../../services/identity-service/.local/keys/access_token_public.pem:/app/.local/keys/access_token_public.pem:ro

    depends_on:
      trip-postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      location-service:
        condition: service_started
      rider-service:
        condition: service_started
      driver-service:
        condition: service_started
      media-service:
        condition: service_started

    ports:
      - "127.0.0.1:50055:50055"
      - "127.0.0.1:9095:9095"

    restart: unless-stopped

  dispatch-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: dispatch-service
    image: ride-platform/dispatch-service:dev
    container_name: ride-dispatch-service

    env_file:
      - ../../services/dispatch-service/.env

    environment:
      DISPATCH_OFFER_TTL: ${DISPATCH_OFFER_TTL:-0s}
      GRPC_ADDRESS: ":50056"
      METRICS_ADDRESS: ":9096"
      TRIP_SERVICE_ADDRESS: trip-service:50055
      LOCATION_SERVICE_ADDRESS: location-service:50054
      DRIVER_SERVICE_ADDRESS: driver-service:50053
      WALLET_SERVICE_ADDRESS: wallet-service:50058
      NATS_URL: nats://nats:4222

    volumes:
      - ../../services/identity-service/.local/keys/access_token_public.pem:/app/.local/keys/access_token_public.pem:ro

    depends_on:
      trip-service:
        condition: service_started
      location-service:
        condition: service_started
      driver-service:
