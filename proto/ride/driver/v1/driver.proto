syntax = "proto3";

package ride.driver.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "ride/dataexport/v1/data_export.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/driver/v1;driverv1";

service DriverService {
  // ExportPersonalData returns what this service keeps about one person,
  // for their "Download your data" file. Internal only (identity-service).
  rpc ExportPersonalData(ride.dataexport.v1.ExportPersonalDataRequest) returns (ride.dataexport.v1.ExportPersonalDataResponse);

  // CreateDriver creates the caller's own driver profile: identity_id must be the caller's identity.
  // The new driver starts PENDING and cannot go online until an operator approves it.
  rpc CreateDriver(CreateDriverRequest) returns (CreateDriverResponse) {
    option (google.api.http) = {
      post: "/v1/drivers"
      body: "*"
    };
  }
  // GetDriver returns the caller's own driver profile.
  rpc GetDriver(GetDriverRequest) returns (GetDriverResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}"
    };
  }
  // GetDriverByIdentity finds the caller's driver profile from their identity id.
  rpc GetDriverByIdentity(GetDriverByIdentityRequest) returns (GetDriverResponse) {
    option (google.api.http) = {
      get: "/v1/identities/{identity_id}/driver"
    };
  }
  // UpdateDriverProfile changes the caller's own driver profile and vehicle.
  // Once approved, the name and the vehicle can no longer be changed this way
  // (FAILED_PRECONDITION).
  rpc UpdateDriverProfile(UpdateDriverProfileRequest) returns (UpdateDriverProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/drivers/{driver_id}"
      body: "*"
    };
  }
  // UpdateAvailability goes online or offline; only the driver themselves may.
  // A PENDING or REJECTED driver may only be offline (FAILED_PRECONDITION otherwise).
  // Going AVAILABLE also needs every required document approved and in date
  // (FAILED_PRECONDITION); a BUSY driver who is not is put OFFLINE instead.
  rpc UpdateAvailability(UpdateAvailabilityRequest) returns (UpdateAvailabilityResponse) {
    option (google.api.http) = {
      put: "/v1/drivers/{driver_id}/availability"
      body: "*"
    };
  }
  // ApproveDriver moves a PENDING (or REJECTED) driver to ACTIVE. Staff with
  // drivers.approve, or the internal token. A driver can never approve themselves.
  // Every required document must be approved and in date (FAILED_PRECONDITION).
  rpc ApproveDriver(ApproveDriverRequest) returns (ApproveDriverResponse) {
    option (google.api.http) = {
      post: "/v1/admin/drivers/{driver_id}:approve"
      body: "*"
    };
  }
  // RejectDriver moves a PENDING driver to REJECTED, with the reason the driver
  // is shown. Staff with drivers.approve, or the internal token.
  rpc RejectDriver(RejectDriverRequest) returns (RejectDriverResponse) {
    option (google.api.http) = {
      post: "/v1/admin/drivers/{driver_id}:reject"
      body: "*"
    };
  }
  // ListDrivers lists drivers for the review queue and the admin, newest first,
  // optionally by status. Staff with drivers.read, or the internal token.
  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse) {
    option (google.api.http) = {
      get: "/v1/admin/drivers"
    };
  }

  // ListDriverDocumentTypes lists the documents a driver is asked for (the
  // active types), in the order the app shows them. Any signed-in user.
  rpc ListDriverDocumentTypes(ListDriverDocumentTypesRequest) returns (ListDriverDocumentTypesResponse) {
    option (google.api.http) = {
      get: "/v1/driver-document-types"
    };
  }
  // AdminListDriverDocumentTypes lists every type, inactive ones too. Staff
  // with drivers.read, or the internal token.
  rpc AdminListDriverDocumentTypes(ListDriverDocumentTypesRequest) returns (ListDriverDocumentTypesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/driver-document-types"
    };
  }
  // UpsertDriverDocumentType creates or changes a document type: whether it is
  // required, needs a number or an expiry date, and whether it is asked for at
  // all. Staff with drivers.configure, or the internal token.
  rpc UpsertDriverDocumentType(UpsertDriverDocumentTypeRequest) returns (DriverDocumentTypeResponse) {
    option (google.api.http) = {
      put: "/v1/admin/driver-document-types/{code}"
      body: "*"
    };
  }
  // SubmitDriverDocument hands an uploaded file (media-service, READY, the
  // driver's own, of the type's purpose) in as a document, waiting for review.
  // It replaces an earlier pending or rejected one of the same type; an
  // approved one stays valid until the new one is approved.
  rpc SubmitDriverDocument(SubmitDriverDocumentRequest) returns (DriverDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/drivers/{driver_id}/documents"
      body: "*"
    };
  }
  // ListDriverDocuments shows, per document type, where the driver stands, and
  // whether they may work. The driver, or staff with drivers.read.
  rpc ListDriverDocuments(ListDriverDocumentsRequest) returns (ListDriverDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/documents"
    };
  }
  // ListPendingDriverDocuments is the review queue, oldest first. Staff with
  // drivers.read, or the internal token.
  rpc ListPendingDriverDocuments(ListPendingDriverDocumentsRequest) returns (ListPendingDriverDocumentsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/driver-documents"
    };
  }
  // ApproveDriverDocument approves a pending document; the reviewer may correct
  // the number and expiry date read from it. It replaces the driver's earlier
  // approved one of that type. Staff with drivers.approve, or the internal token.
  rpc ApproveDriverDocument(ApproveDriverDocumentRequest) returns (DriverDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/admin/driver-documents/{document_id}:approve"
      body: "*"
    };
  }
  // RejectDriverDocument turns down a pending document, or withdraws an
  // approved one (a driver who is online then goes offline), with the reason
  // the driver is shown. Staff with drivers.approve, or the internal token.
  rpc RejectDriverDocument(RejectDriverDocumentRequest) returns (DriverDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/admin/driver-documents/{document_id}:reject"
      body: "*"
    };
  }

  // AddVehicle registers another car for the driver. It waits for staff review
  // (and its documents) before it can be made active. At most 5 cars in service.
  rpc AddVehicle(AddVehicleRequest) returns (VehicleResponse) {
    option (google.api.http) = {
      post: "/v1/drivers/{driver_id}/vehicles"
      body: "*"
    };
  }
  // ListVehicles lists the driver's cars, retired ones last. The driver, or
  // staff with drivers.read.
  rpc ListVehicles(ListVehiclesRequest) returns (ListVehiclesResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/vehicles"
    };
  }
  // UpdateVehicle corrects a car that is still pending or was rejected; a
  // rejected car goes back to review.
  rpc UpdateVehicle(UpdateVehicleRequest) returns (VehicleResponse) {
    option (google.api.http) = {
      patch: "/v1/drivers/{driver_id}/vehicles/{vehicle_id}"
      body: "*"
    };
  }
  // ActivateVehicle makes an approved car the one the driver works with. The
  // driver must be offline.
  rpc ActivateVehicle(VehicleActionRequest) returns (VehicleResponse) {
    option (google.api.http) = {
      post: "/v1/drivers/{driver_id}/vehicles/{vehicle_id}:activate"
      body: "*"
    };
  }
  // RetireVehicle takes a car out of service for good (sold, scrapped); its
  // documents go with it. The active car cannot be retired.
  rpc RetireVehicle(VehicleActionRequest) returns (VehicleResponse) {
    option (google.api.http) = {
      post: "/v1/drivers/{driver_id}/vehicles/{vehicle_id}:retire"
      body: "*"
    };
  }
  // ListPendingVehicles is the car review queue, oldest first. Staff with
  // drivers.read, or the internal token.
  rpc ListPendingVehicles(ListPendingVehiclesRequest) returns (ListPendingVehiclesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/vehicles"
    };
  }
  // ApproveVehicle approves a pending car once its required documents are
  // approved and in date; the reviewer may set its year and class. Staff with
  // drivers.approve, or the internal token.
  rpc ApproveVehicle(ApproveVehicleRequest) returns (VehicleResponse) {
    option (google.api.http) = {
      post: "/v1/admin/vehicles/{vehicle_id}:approve"
      body: "*"
    };
  }
  // RejectVehicle turns down a pending car, with the reason the driver is
  // shown. Staff with drivers.approve, or the internal token.
  rpc RejectVehicle(RejectVehicleRequest) returns (VehicleResponse) {
    option (google.api.http) = {
      post: "/v1/admin/vehicles/{vehicle_id}:reject"
      body: "*"
    };
  }
  // Details: gender, date of birth (18 or older) and nationality (ISO 3166
  // alpha-2). The driver's own (staff with drivers.read too).
  rpc GetDriverDetails(GetDriverDetailsRequest) returns (DriverDetailsResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/details"
    };
  }
  // UpdateDriverDetails changes only the fields sent. Once the driver is
  // approved, a field already given only changes through support
  // (FAILED_PRECONDITION); an empty one can still be filled in.
  rpc UpdateDriverDetails(UpdateDriverDetailsRequest) returns (DriverDetailsResponse) {
    option (google.api.http) = {
      patch: "/v1/drivers/{driver_id}/details"
      body: "*"
    };
  }
  // GetDriverPhoto: a short-lived link to the driver's approved profile
  // photo (the PROFILE_PHOTO document), for the driver and for services
  // (trip-service shows it to the rider). NOT_FOUND without one.
  rpc GetDriverPhoto(GetDriverPhotoRequest) returns (DriverPhotoResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/photo"
    };
  }
  // Name changes: an approved driver's name changes only after staff check
  // it against the approved ID (drivers.approve). One open request at a
  // time; a pending driver just edits the profile.
  rpc RequestNameChange(RequestNameChangeRequest) returns (NameChangeResponse) {
    option (google.api.http) = {
      post: "/v1/drivers/{driver_id}/name-changes"
      body: "*"
    };
  }
  rpc ListNameChanges(ListNameChangesRequest) returns (ListNameChangesResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/name-changes"
    };
  }
  // The review queue, oldest first. Needs drivers.read.
  rpc ListPendingNameChanges(ListPendingNameChangesRequest) returns (ListNameChangesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/driver-name-changes"
    };
  }
  rpc ApproveNameChange(ApproveNameChangeRequest) returns (NameChangeResponse) {
    option (google.api.http) = {
      post: "/v1/admin/driver-name-changes/{name_change_id}:approve"
      body: "*"
    };
  }
  rpc RejectNameChange(RejectNameChangeRequest) returns (NameChangeResponse) {
    option (google.api.http) = {
      post: "/v1/admin/driver-name-changes/{name_change_id}:reject"
      body: "*"
    };
  }

}

enum DriverStatus {
  DRIVER_STATUS_UNSPECIFIED = 0;
  DRIVER_STATUS_ACTIVE = 1;
  DRIVER_STATUS_SUSPENDED = 2;
  // Registered, waiting for an operator to review the driver.
  DRIVER_STATUS_PENDING = 3;
  // Reviewed and turned down by an operator.
  DRIVER_STATUS_REJECTED = 4;
}

enum AvailabilityStatus {
  AVAILABILITY_STATUS_UNSPECIFIED = 0;
  AVAILABILITY_STATUS_OFFLINE = 1;
  AVAILABILITY_STATUS_AVAILABLE = 2;
  AVAILABILITY_STATUS_BUSY = 3;
}

message Vehicle {
  string make = 1;
  string model = 2;
  string color = 3;
  string plate_number = 4;
  string vehicle_class = 5; // economy or comfort
  // The active car's id; ignored on input.
  string id = 6;
  // Year of manufacture; 0 when not given (older registrations).
  int32 year = 7;
}

message Driver {
  string id = 1;
  string identity_id = 2;
  string display_name = 3;
  DriverStatus status = 4;
  AvailabilityStatus availability_status = 5;
  Vehicle vehicle = 6;
  double rating_average = 7;
  int32 rating_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Why the last review turned the driver down; empty unless REJECTED.
  string rejection_reason = 11;
}

message CreateDriverRequest {
  string identity_id = 1;
  string display_name = 2;
  Vehicle vehicle = 3;
}

message CreateDriverResponse {
  Driver driver = 1;
}

message GetDriverRequest {
  string driver_id = 1;
}

message GetDriverByIdentityRequest {
  string identity_id = 1;
}

message GetDriverResponse {
  Driver driver = 1;
}

message UpdateDriverProfileRequest {
  string driver_id = 1;
  string display_name = 2;
  Vehicle vehicle = 3;
}

message UpdateDriverProfileResponse {
  Driver driver = 1;
}

message UpdateAvailabilityRequest {
  string driver_id = 1;
  AvailabilityStatus availability_status = 2;
}

message UpdateAvailabilityResponse {
  Driver driver = 1;
}

message ApproveDriverRequest {
  string driver_id = 1;
}

message ApproveDriverResponse {
  Driver driver = 1;
}

message RejectDriverRequest {
  string driver_id = 1;
  // Shown to the driver. Optional for the internal token, required for staff.
  string reason = 2;
}

message RejectDriverResponse {
  Driver driver = 1;
}

message ListDriversRequest {
  // Optional filter.
  DriverStatus status = 1;
  int32 page_size = 2;
  // The next_page_token of the previous page; empty for the first page.
  string page_token = 3;
}

message ListDriversResponse {
  repeated Driver drivers = 1;
  string next_page_token = 2;
}

message DriverDocumentType {
  // Stable key, e.g. driving_licence_front.
  string code = 1;
  // The media-service purpose the file is uploaded with: "driver_document"
  // or "profile_photo".
  string media_purpose = 2;
  string name_en = 3;
  string name_ar = 4;
  string name_ku = 5;
  // A driver cannot be approved, or go online, without it approved and in date.
  bool required = 6;
  // The driver types the document's number (ID number, licence number).
  bool requires_number = 7;
  // The driver gives the last day it is valid; it is then checked every day.
  bool requires_expiry = 8;
  // Inactive types are not asked for.
  bool active = 9;
  int32 sort_order = 10;
  // "driver" (ID, licence, photo) or "vehicle" (registration, car photos):
  // a vehicle document is handed in for one car.
  string scope = 11;
}

enum DriverDocumentStatus {
  DRIVER_DOCUMENT_STATUS_UNSPECIFIED = 0;
  DRIVER_DOCUMENT_STATUS_PENDING = 1;
  DRIVER_DOCUMENT_STATUS_APPROVED = 2;
  DRIVER_DOCUMENT_STATUS_REJECTED = 3;
  // Replaced by a newer document of the same type; its file is deleted.
  DRIVER_DOCUMENT_STATUS_SUPERSEDED = 4;
}

message DriverDocument {
  string id = 1;
  string driver_id = 2;
  string type_code = 3;
  // The file in media-service (GetDownloadURL: the driver, or staff with media.read).
  string media_id = 4;
  string document_number = 5;
  // Last valid day, YYYY-MM-DD; empty when the type has no expiry.
  string expires_on = 6;
  DriverDocumentStatus status = 7;
  string rejection_reason = 8;
  google.protobuf.Timestamp submitted_at = 9;
  google.protobuf.Timestamp reviewed_at = 10;
  // An approved document whose last valid day has passed.
  bool expired = 11;
  // The car a vehicle document is for; empty for the driver's own documents.
  string vehicle_id = 12;
}

enum DocumentRequirementState {
  DOCUMENT_REQUIREMENT_STATE_UNSPECIFIED = 0;
  // Nothing submitted yet.
  DOCUMENT_REQUIREMENT_STATE_MISSING = 1;
  // Submitted, waiting for review; nothing approved yet.
  DOCUMENT_REQUIREMENT_STATE_PENDING_REVIEW = 2;
  // The last one was turned down; a new one is needed.
  DOCUMENT_REQUIREMENT_STATE_REJECTED = 3;
  DOCUMENT_REQUIREMENT_STATE_APPROVED = 4;
  // Approved, but its last valid day is within the reminder window.
  DOCUMENT_REQUIREMENT_STATE_EXPIRING_SOON = 5;
  // Approved, but no longer in date.
  DOCUMENT_REQUIREMENT_STATE_EXPIRED = 6;
}

message DocumentRequirement {
  DriverDocumentType type = 1;
  DocumentRequirementState state = 2;
  // The document in force, if any.
  DriverDocument approved = 3;
  // A newer one waiting for review, if any (a renewal when approved is set).
  DriverDocument pending = 4;
  // The last one turned down, if no newer one was submitted since.
  DriverDocument rejected = 5;
  // The car a vehicle requirement is for; empty for the driver's own.
  string vehicle_id = 6;
}

message ListDriverDocumentTypesRequest {}

message ListDriverDocumentTypesResponse {
  repeated DriverDocumentType types = 1;
}

message UpsertDriverDocumentTypeRequest {
  string code = 1;
  DriverDocumentType type = 2;
}

message DriverDocumentTypeResponse {
  DriverDocumentType type = 1;
}

message SubmitDriverDocumentRequest {
  string driver_id = 1;
  string type_code = 2;
  string media_id = 3;
  // Required when the type requires a number; ignored otherwise.
  string document_number = 4;
  // YYYY-MM-DD, after today. Required when the type has an expiry; ignored otherwise.
  string expires_on = 5;
  // For a vehicle document: the car. Empty means the active car.
  string vehicle_id = 6;
}

message DriverDocumentResponse {
  DriverDocument document = 1;
}

message ListDriverDocumentsRequest {
  string driver_id = 1;
  // Also return every document ever submitted, newest first.
  bool include_history = 2;
  // Only the vehicle requirements of this car (e.g. a new one). Empty: the
  // driver's own and the active car's.
  string vehicle_id = 3;
}

message ListDriverDocumentsResponse {
  // One per active document type (per car for vehicle types), in the app's order.
  repeated DocumentRequirement requirements = 1;
  // Every required document of the driver and of the active car is approved
  // and in date, and the active car is not rejected (a new driver's first car
  // is approved together with them).
  bool compliant = 2;
  repeated DriverDocument history = 3;
  // The car the vehicle requirements are for, if any.
  DriverVehicle vehicle = 4;
}

message ListPendingDriverDocumentsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PendingDriverDocument {
  DriverDocument document = 1;
  string driver_display_name = 2;
  DriverStatus driver_status = 3;
}

message ListPendingDriverDocumentsResponse {
  repeated PendingDriverDocument documents = 1;
  string next_page_token = 2;
}

message ApproveDriverDocumentRequest {
  string document_id = 1;
  // Optional corrections; empty keeps what the driver gave.
  string document_number = 2;
  string expires_on = 3;
}

message RejectDriverDocumentRequest {
  string document_id = 1;
  // Shown to the driver. Required.
  string reason = 2;
}

enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_PENDING = 1;
  VEHICLE_STATUS_APPROVED = 2;
  VEHICLE_STATUS_REJECTED = 3;
  // Out of service for good.
  VEHICLE_STATUS_RETIRED = 4;
}

message DriverVehicle {
  string id = 1;
  string driver_id = 2;
  string make = 3;
  string model = 4;
  string color = 5;
  string plate_number = 6;
  // 0 when not given (older registrations).
  int32 year = 7;
  string vehicle_class = 8;
  VehicleStatus status = 9;
  // The car the driver works with.
  bool active = 10;
  string rejection_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp reviewed_at = 13;
}

message VehicleResponse {
  DriverVehicle vehicle = 1;
}

message AddVehicleRequest {
  string driver_id = 1;
  string make = 2;
  string model = 3;
  string color = 4;
  string plate_number = 5;
  int32 year = 6;
  // economy or comfort; staff may change it on approval. Empty: economy.
  string vehicle_class = 7;
}

message ListVehiclesRequest {
  string driver_id = 1;
}

message ListVehiclesResponse {
  repeated DriverVehicle vehicles = 1;
}

message UpdateVehicleRequest {
  string driver_id = 1;
  string vehicle_id = 2;
  string make = 3;
  string model = 4;
  string color = 5;
  string plate_number = 6;
  int32 year = 7;
  string vehicle_class = 8;
}

message VehicleActionRequest {
  string driver_id = 1;
  string vehicle_id = 2;
}

message ListPendingVehiclesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PendingVehicle {
  DriverVehicle vehicle = 1;
  string driver_display_name = 2;
  DriverStatus driver_status = 3;
}

message ListPendingVehiclesResponse {
  repeated PendingVehicle vehicles = 1;
  string next_page_token = 2;
}

message ApproveVehicleRequest {
  string vehicle_id = 1;
  // Optional: set when the driver left it out or got it wrong.
  int32 year = 2;
  // Optional: economy or comfort, what the car qualifies for.
  string vehicle_class = 3;
}

message RejectVehicleRequest {
  string vehicle_id = 1;
  // Shown to the driver. Required.
  string reason = 2;
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

message DriverDetails {
  string driver_id = 1;
  Gender gender = 2;
  // YYYY-MM-DD, empty when not given.
  string date_of_birth = 3;
  // ISO 3166-1 alpha-2, empty when not given.
  string nationality = 4;
  // An approved profile photo exists.
  bool has_photo = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetDriverDetailsRequest {
  string driver_id = 1;
}

message DriverDetailsResponse {
  DriverDetails details = 1;
}

message UpdateDriverDetailsRequest {
  string driver_id = 1;
  // Only the fields present change. GENDER_UNSPECIFIED or "" clears one
  // (before approval).
  optional Gender gender = 2;
  optional string date_of_birth = 3;
  optional string nationality = 4;
}

message GetDriverPhotoRequest {
  string driver_id = 1;
}

message DriverPhotoResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

enum NameChangeStatus {
  NAME_CHANGE_STATUS_UNSPECIFIED = 0;
  NAME_CHANGE_STATUS_PENDING = 1;
  NAME_CHANGE_STATUS_APPROVED = 2;
  NAME_CHANGE_STATUS_REJECTED = 3;
}

message NameChange {
  string id = 1;
  string driver_id = 2;
  string current_name = 3;
  string requested_name = 4;
  // Why the driver asks (a marriage, a typo...), up to 300 characters.
  string reason = 5;
  NameChangeStatus status = 6;
  string rejection_reason = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp decided_at = 9;
}

message RequestNameChangeRequest {
  string driver_id = 1;
  string requested_name = 2;
  string reason = 3;
}

message NameChangeResponse {
  NameChange name_change = 1;
}

message ListNameChangesRequest {
  string driver_id = 1;
}

message ListNameChangesResponse {
  repeated NameChange name_changes = 1;
}

message ListPendingNameChangesRequest {
  int32 page_size = 1;
}

message ApproveNameChangeRequest {
  string name_change_id = 1;
}

message RejectNameChangeRequest {
  string name_change_id = 1;
  // Required, up to 500 characters; the driver sees it.
  string reason = 2;
}
