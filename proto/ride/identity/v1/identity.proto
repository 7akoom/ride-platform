syntax = "proto3";

package ride.identity.v1;

option go_package = "github.com/7akoom/ride-platform/gen/go/ride/identity/v1;identityv1";

service IdentityService {
  rpc RequestLoginOTP(RequestLoginOTPRequest) returns (RequestLoginOTPResponse);
  rpc VerifyLoginOTP(VerifyLoginOTPRequest) returns (VerifyLoginOTPResponse);

  rpc RequestIdentifierLinkOTP(RequestIdentifierLinkOTPRequest) returns (RequestIdentifierLinkOTPResponse);
  rpc VerifyIdentifierLinkOTP(VerifyIdentifierLinkOTPRequest) returns (VerifyIdentifierLinkOTPResponse);

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc LogoutAllSessions(LogoutAllSessionsRequest) returns (LogoutAllSessionsResponse);
}

enum IdentifierType {
  IDENTIFIER_TYPE_UNSPECIFIED = 0;
  IDENTIFIER_TYPE_PHONE = 1;
  IDENTIFIER_TYPE_EMAIL = 2;
}

message Identifier {
  IdentifierType type = 1;
  string value = 2;
}

message RequestLoginOTPRequest {
  Identifier identifier = 1;
}

message RequestLoginOTPResponse {
  string challenge_id = 1;
  int32 expires_in_seconds = 2;
}

message VerifyLoginOTPRequest {
  string challenge_id = 1;
  string code = 2;
}

message VerifyLoginOTPResponse {
  string identity_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 access_token_expires_in_seconds = 4;
}

message RequestIdentifierLinkOTPRequest {
  Identifier identifier = 1;
}

message RequestIdentifierLinkOTPResponse {
  string challenge_id = 1;
  int32 expires_in_seconds = 2;
}

message VerifyIdentifierLinkOTPRequest {
  string challenge_id = 1;
  string code = 2;
}

message VerifyIdentifierLinkOTPResponse {}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string identity_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 access_token_expires_in_seconds = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message LogoutAllSessionsRequest {
  string refresh_token = 1;
}

message LogoutAllSessionsResponse {}