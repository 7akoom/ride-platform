syntax = "proto3";

package ride.identity.v1;

option go_package = "github.com/7akoom/ride-platform/gen/go/ride/identity/v1;identityv1";

service IdentityService {
  rpc RequestOTP(RequestOTPRequest) returns (RequestOTPResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc LogoutAllSessions(LogoutAllSessionsRequest) returns (LogoutAllSessionsResponse);
}

message RequestOTPRequest {
  string phone_number = 1;
}

message RequestOTPResponse {
  string challenge_id = 1;
  int32 expires_in_seconds = 2;
}

message VerifyOTPRequest {
  string challenge_id = 1;
  string code = 2;
}

message VerifyOTPResponse {
  string identity_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 access_token_expires_in_seconds = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string identity_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 access_token_expires_in_seconds = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message LogoutAllSessionsRequest {
  string refresh_token = 1;
}

message LogoutAllSessionsResponse {}