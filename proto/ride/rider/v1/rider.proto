syntax = "proto3";

package ride.rider.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "ride/dataexport/v1/data_export.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/rider/v1;riderv1";

service RiderService {
  // ExportPersonalData returns what this service keeps about one person,
  // for their "Download your data" file. Internal only (identity-service).
  rpc ExportPersonalData(ride.dataexport.v1.ExportPersonalDataRequest) returns (ride.dataexport.v1.ExportPersonalDataResponse);

  // CreateRider creates the caller's own rider profile: identity_id must be the caller's identity.
  rpc CreateRider(CreateRiderRequest) returns (CreateRiderResponse) {
    option (google.api.http) = {
      post: "/v1/riders"
      body: "*"
    };
  }
  // GetRider returns the caller's own rider profile.
  rpc GetRider(GetRiderRequest) returns (GetRiderResponse) {
    option (google.api.http) = {
      get: "/v1/riders/{rider_id}"
    };
  }
  // GetRiderByIdentity finds the caller's rider profile from their identity id.
  rpc GetRiderByIdentity(GetRiderByIdentityRequest) returns (GetRiderResponse) {
    option (google.api.http) = {
      get: "/v1/identities/{identity_id}/rider"
    };
  }
  // UpdateRiderProfile changes the caller's own rider profile.
  rpc UpdateRiderProfile(UpdateRiderProfileRequest) returns (UpdateRiderProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/riders/{rider_id}"
      body: "*"
    };
  }

  // Saved addresses: the caller's own home, work and other places, with what
  // helps the captain find them (building, floor, a note, a photo). At most 20,
  // one home and one work. Services (trip-service, with the internal token)
  // read them when a trip is requested from one.
  rpc CreateSavedAddress(CreateSavedAddressRequest) returns (SavedAddressResponse) {
    option (google.api.http) = {
      post: "/v1/riders/{rider_id}/addresses"
      body: "*"
    };
  }
  rpc ListSavedAddresses(ListSavedAddressesRequest) returns (ListSavedAddressesResponse) {
    option (google.api.http) = {
      get: "/v1/riders/{rider_id}/addresses"
    };
  }
  rpc GetSavedAddress(GetSavedAddressRequest) returns (SavedAddressResponse) {
    option (google.api.http) = {
      get: "/v1/riders/{rider_id}/addresses/{address_id}"
    };
  }
  rpc UpdateSavedAddress(UpdateSavedAddressRequest) returns (SavedAddressResponse) {
    option (google.api.http) = {
      patch: "/v1/riders/{rider_id}/addresses/{address_id}"
      body: "*"
    };
  }
  rpc DeleteSavedAddress(DeleteSavedAddressRequest) returns (DeleteSavedAddressResponse) {
    option (google.api.http) = {
      delete: "/v1/riders/{rider_id}/addresses/{address_id}"
    };
  }
  // Details: gender, date of birth (18 or older) and nationality (ISO 3166
  // alpha-2), all optional; and whether a photo is set. The caller's own.
  rpc GetRiderDetails(GetRiderDetailsRequest) returns (RiderDetailsResponse) {
    option (google.api.http) = {
      get: "/v1/riders/{rider_id}/details"
    };
  }
  // UpdateRiderDetails changes only the fields sent; an empty value clears
  // one.
  rpc UpdateRiderDetails(UpdateRiderDetailsRequest) returns (RiderDetailsResponse) {
    option (google.api.http) = {
      patch: "/v1/riders/{rider_id}/details"
      body: "*"
    };
  }
  // SetRiderPhoto uses one of the caller's READY PROFILE_PHOTO uploads as
  // their picture; the old one is deleted.
  rpc SetRiderPhoto(SetRiderPhotoRequest) returns (RiderDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/riders/{rider_id}/photo"
      body: "*"
    };
  }
  rpc DeleteRiderPhoto(DeleteRiderPhotoRequest) returns (RiderDetailsResponse) {
    option (google.api.http) = {
      delete: "/v1/riders/{rider_id}/photo"
    };
  }
  // GetRiderPhoto: a short-lived link to the picture, for the rider (and for
  // services). NOT_FOUND without one.
  rpc GetRiderPhoto(GetRiderPhotoRequest) returns (PhotoURLResponse) {
    option (google.api.http) = {
      get: "/v1/riders/{rider_id}/photo"
    };
  }

}

enum RiderStatus {
  RIDER_STATUS_UNSPECIFIED = 0;
  RIDER_STATUS_ACTIVE = 1;
  RIDER_STATUS_SUSPENDED = 2;
}

message Rider {
  string id = 1;
  string identity_id = 2;
  string display_name = 3;
  RiderStatus status = 4;
  double rating_average = 5;
  int32 rating_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateRiderRequest {
  string identity_id = 1;
  string display_name = 2;
}

message CreateRiderResponse {
  Rider rider = 1;
}

message GetRiderRequest {
  string rider_id = 1;
}

message GetRiderByIdentityRequest {
  string identity_id = 1;
}

message GetRiderResponse {
  Rider rider = 1;
}

message UpdateRiderProfileRequest {
  string rider_id = 1;
  string display_name = 2;
}

message UpdateRiderProfileResponse {
  Rider rider = 1;
}

message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

enum SavedAddressKind {
  SAVED_ADDRESS_KIND_UNSPECIFIED = 0;
  // At most one of each per rider.
  SAVED_ADDRESS_KIND_HOME = 1;
  SAVED_ADDRESS_KIND_WORK = 2;
  // Needs a label ("Gym", "Mum's").
  SAVED_ADDRESS_KIND_OTHER = 3;
}

message SavedAddress {
  string id = 1;
  string rider_id = 2;
  SavedAddressKind kind = 3;
  // Required for OTHER; optional otherwise. At most 60 characters.
  string label = 4;
  // The exact point to be picked up or dropped at.
  Coordinates coordinates = 5;
  // The address as shown ("Gulan Street, Erbil"); at most 300 characters.
  string address = 6;
  // Building, floor, apartment; at most 200 characters.
  string details = 7;
  // For the captain ("Blue gate, ring twice"); at most 300 characters.
  string note_for_driver = 8;
  // A photo of the entrance (media-service, purpose ADDRESS_PHOTO), or empty.
  string photo_media_id = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateSavedAddressRequest {
  string rider_id = 1;
  SavedAddressKind kind = 2;
  string label = 3;
  Coordinates coordinates = 4;
  string address = 5;
  string details = 6;
  string note_for_driver = 7;
  // Optional: a READY upload of the caller's with purpose ADDRESS_PHOTO. It is
  // then kept by the address (the owner can no longer delete it on its own) and
  // deleted with it.
  string photo_media_id = 8;
}

message ListSavedAddressesRequest {
  string rider_id = 1;
}

message ListSavedAddressesResponse {
  // Home, then work, then the others by label.
  repeated SavedAddress addresses = 1;
}

message GetSavedAddressRequest {
  string rider_id = 1;
  string address_id = 2;
}

message SavedAddressResponse {
  SavedAddress address = 1;
}

// UpdateSavedAddress replaces kind, label, coordinates, address, details and
// note. The photo changes only when photo_media_id is set (the old one is
// deleted) or remove_photo is true.
message UpdateSavedAddressRequest {
  string rider_id = 1;
  string address_id = 2;
  SavedAddressKind kind = 3;
  string label = 4;
  Coordinates coordinates = 5;
  string address = 6;
  string details = 7;
  string note_for_driver = 8;
  string photo_media_id = 9;
  bool remove_photo = 10;
}

message DeleteSavedAddressRequest {
  string rider_id = 1;
  string address_id = 2;
}

message DeleteSavedAddressResponse {}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

message RiderDetails {
  string rider_id = 1;
  Gender gender = 2;
  // YYYY-MM-DD, empty when not given.
  string date_of_birth = 3;
  // ISO 3166-1 alpha-2 (IQ, SY...), empty when not given.
  string nationality = 4;
  bool has_photo = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetRiderDetailsRequest {
  string rider_id = 1;
}

message RiderDetailsResponse {
  RiderDetails details = 1;
}

message UpdateRiderDetailsRequest {
  string rider_id = 1;
  // Only the fields present change. GENDER_UNSPECIFIED or "" clears one.
  optional Gender gender = 2;
  optional string date_of_birth = 3;
  optional string nationality = 4;
}

message SetRiderPhotoRequest {
  string rider_id = 1;
  string media_id = 2;
}

message DeleteRiderPhotoRequest {
  string rider_id = 1;
}

message GetRiderPhotoRequest {
  string rider_id = 1;
}

message PhotoURLResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}
