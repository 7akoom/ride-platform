syntax = "proto3";

package ride.rider.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/rider/v1;riderv1";

service RiderService {
  // CreateRider creates the caller's own rider profile: identity_id must be the caller's identity.
  rpc CreateRider(CreateRiderRequest) returns (CreateRiderResponse) {
    option (google.api.http) = {
      post: "/v1/riders"
      body: "*"
    };
  }
  // GetRider returns the caller's own rider profile.
  rpc GetRider(GetRiderRequest) returns (GetRiderResponse) {
    option (google.api.http) = {
      get: "/v1/riders/{rider_id}"
    };
  }
  // GetRiderByIdentity finds the caller's rider profile from their identity id.
  rpc GetRiderByIdentity(GetRiderByIdentityRequest) returns (GetRiderResponse) {
    option (google.api.http) = {
      get: "/v1/identities/{identity_id}/rider"
    };
  }
  // UpdateRiderProfile changes the caller's own rider profile.
  rpc UpdateRiderProfile(UpdateRiderProfileRequest) returns (UpdateRiderProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/riders/{rider_id}"
      body: "*"
    };
  }
}

enum RiderStatus {
  RIDER_STATUS_UNSPECIFIED = 0;
  RIDER_STATUS_ACTIVE = 1;
  RIDER_STATUS_SUSPENDED = 2;
}

message Rider {
  string id = 1;
  string identity_id = 2;
  string display_name = 3;
  RiderStatus status = 4;
  double rating_average = 5;
  int32 rating_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateRiderRequest {
  string identity_id = 1;
  string display_name = 2;
}

message CreateRiderResponse {
  Rider rider = 1;
}

message GetRiderRequest {
  string rider_id = 1;
}

message GetRiderByIdentityRequest {
  string identity_id = 1;
}

message GetRiderResponse {
  Rider rider = 1;
}

message UpdateRiderProfileRequest {
  string rider_id = 1;
  string display_name = 2;
}

message UpdateRiderProfileResponse {
  Rider rider = 1;
}
