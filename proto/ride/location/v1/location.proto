syntax = "proto3";

package ride.location.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/location/v1;locationv1";

service LocationService {
  // UpdateLocation reports the caller's own position (driver app, every few seconds).
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse) {
    option (google.api.http) = {
      put: "/v1/locations/{entity_id}"
      body: "*"
    };
  }
  // GetLocation is the rider app's poll target for a driver's live
  // position during an active trip (entity_type=ENTITY_TYPE_DRIVER).
  // entity_type isn't in the path because grpc-gateway can't bind an
  // enum's string value there reliably — it comes through as a normal
  // query param (?entity_type=ENTITY_TYPE_DRIVER) instead.
  rpc GetLocation(GetLocationRequest) returns (GetLocationResponse) {
    option (google.api.http) = {
      get: "/v1/locations/{entity_id}"
    };
  }
  rpc FindNearby(FindNearbyRequest) returns (FindNearbyResponse);

  // Service zones — the geographic areas the platform actually serves,
  // down to arbitrary polygons (not just a city name). See
  // CheckServiceZone for the query every trip request must pass.
  // CreateZone, UpdateZone and SetZoneActive change the served map: staff with
  // zones.manage, or the internal token.
  rpc CreateZone(CreateZoneRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      post: "/v1/admin/zones"
      body: "*"
    };
  }
  rpc UpdateZone(UpdateZoneRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/zones/{zone_id}"
      body: "*"
    };
  }
  rpc SetZoneActive(SetZoneActiveRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      post: "/v1/admin/zones/{zone_id}:setActive"
      body: "*"
    };
  }
  // GetZone reads one service zone.
  rpc GetZone(GetZoneRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      get: "/v1/zones/{zone_id}"
    };
  }
  // ListZones lists service zones, optionally for one city (?city_id=).
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse) {
    option (google.api.http) = {
      get: "/v1/zones"
    };
  }
  // CheckServiceZone tells whether a point is served (?coordinates.latitude=&coordinates.longitude=).
  rpc CheckServiceZone(CheckServiceZoneRequest) returns (CheckServiceZoneResponse) {
    option (google.api.http) = {
      get: "/v1/zones:check"
    };
  }

  // Cities the platform operates in. Every service zone and curated place
  // belongs to one; its time zone is the one schedules and reports use.
  // ListCities and GetCity show active cities to any signed-in user.
  rpc ListCities(ListCitiesRequest) returns (ListCitiesResponse) {
    option (google.api.http) = {
      get: "/v1/cities"
    };
  }
  rpc GetCity(GetCityRequest) returns (CityResponse) {
    option (google.api.http) = {
      get: "/v1/cities/{city_id}"
    };
  }
  // Staff with zones.manage (or the internal token) manage cities; the admin
  // list includes inactive ones. Switching a city off stops serving all its
  // zones at once.
  rpc AdminListCities(AdminListCitiesRequest) returns (ListCitiesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/cities"
    };
  }
  rpc CreateCity(CreateCityRequest) returns (CityResponse) {
    option (google.api.http) = {
      post: "/v1/admin/cities"
      body: "*"
    };
  }
  rpc UpdateCity(UpdateCityRequest) returns (CityResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/cities/{city_id}"
      body: "*"
    };
  }
  rpc SetCityActive(SetCityActiveRequest) returns (CityResponse) {
    option (google.api.http) = {
      post: "/v1/admin/cities/{city_id}:setActive"
      body: "*"
    };
  }

  // Curated places: airports, malls, hotels... that staff chose, named in
  // every language, with the exact point to be picked up or dropped at.
  // SearchPlaces lists matching curated places before map results.
  // ListPlaces and GetPlace show active places to any signed-in user.
  rpc ListPlaces(ListPlacesRequest) returns (ListPlacesResponse) {
    option (google.api.http) = {
      get: "/v1/places"
    };
  }
  rpc GetPlace(GetPlaceRequest) returns (CuratedPlaceResponse) {
    option (google.api.http) = {
      get: "/v1/places/{place_id}"
    };
  }
  // Staff with places.manage (or the internal token) manage curated places;
  // the admin list includes inactive ones.
  rpc AdminListPlaces(AdminListPlacesRequest) returns (ListPlacesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/places"
    };
  }
  rpc CreatePlace(CreatePlaceRequest) returns (CuratedPlaceResponse) {
    option (google.api.http) = {
      post: "/v1/admin/places"
      body: "*"
    };
  }
  rpc UpdatePlace(UpdatePlaceRequest) returns (CuratedPlaceResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/places/{place_id}"
      body: "*"
    };
  }
  rpc SetPlaceActive(SetPlaceActiveRequest) returns (CuratedPlaceResponse) {
    option (google.api.http) = {
      post: "/v1/admin/places/{place_id}:setActive"
      body: "*"
    };
  }

  // GetRoute returns the best route by road between two points: how far, how long, and
  // the line to draw on a map. Any signed-in user may ask.
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse) {
    option (google.api.http) = {
      post: "/v1/routes:compute"
      body: "*"
    };
  }

  // SearchPlaces finds places (a mall, a street, a neighbourhood) by name, best match
  // first. Any signed-in user may ask.
  rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse) {
    option (google.api.http) = {
      get: "/v1/places:search"
    };
  }

  // ReverseGeocode names what is at a point. Any signed-in user may ask.
  rpc ReverseGeocode(ReverseGeocodeRequest) returns (ReverseGeocodeResponse) {
    option (google.api.http) = {
      get: "/v1/places:reverse"
    };
  }
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_DRIVER = 1;
  ENTITY_TYPE_RIDER = 2;
}

message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

message UpdateLocationRequest {
  EntityType entity_type = 1;
  string entity_id = 2;
  Coordinates coordinates = 3;
}

message UpdateLocationResponse {
  google.protobuf.Timestamp updated_at = 1;
}

message GetLocationRequest {
  EntityType entity_type = 1;
  string entity_id = 2;
}

message GetLocationResponse {
  Coordinates coordinates = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message NearbyEntity {
  string entity_id = 1;
  Coordinates coordinates = 2;
  double distance_meters = 3;
}

message FindNearbyRequest {
  EntityType entity_type = 1;
  Coordinates coordinates = 2;
  double radius_meters = 3;
  int32 limit = 4;
}

message FindNearbyResponse {
  repeated NearbyEntity entities = 1;
}

// --- Service zones ---------------------------------------------------
//
// A zone is an arbitrary polygon within a city, not the city itself —
// a city has as many zones as it needs (distinct approved areas within
// Erbil). boundary is an ordered list of vertices forming a simple
// polygon (first point is not repeated at the end).

message Zone {
  string id = 1;
  // The city's name, for display; city_id is the reference.
  string city = 2;
  string name = 3;
  repeated Coordinates boundary = 4;
  bool active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string city_id = 8;
}

message CreateZoneRequest {
  reserved 1;
  reserved "city";
  string name = 2;
  repeated Coordinates boundary = 3;
  // The city the zone is in (see CreateCity).
  string city_id = 4;
}

message UpdateZoneRequest {
  string zone_id = 1;
  string name = 2;
  repeated Coordinates boundary = 3;
}

message SetZoneActiveRequest {
  string zone_id = 1;
  bool active = 2;
}

message ZoneResponse {
  Zone zone = 1;
}

message GetZoneRequest {
  string zone_id = 1;
}

message ListZonesRequest {
  reserved 1;
  reserved "city";
  // Optional. Empty returns zones for every city.
  string city_id = 2;
}

message ListZonesResponse {
  repeated Zone zones = 1;
}

message CheckServiceZoneRequest {
  Coordinates coordinates = 1;
}

message CheckServiceZoneResponse {
  bool served = 1;
  // Only set when served is true. A point is served when an active zone of an
  // active city covers it.
  string zone_id = 2;
  // The city's name.
  string city = 3;
  string city_id = 4;
  // The city's IANA time zone, for example "Asia/Baghdad".
  string time_zone = 5;
}

// --- Cities ------------------------------------------------------------

message City {
  string id = 1;
  // The name used when no translation fits.
  string name = 2;
  // The name in other languages, by language: "ar", "ku", "en".
  map<string, string> names = 3;
  // IANA time zone, for example "Asia/Baghdad".
  string time_zone = 4;
  // Where a map of the city opens.
  Coordinates center = 5;
  bool active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListCitiesRequest {}

message AdminListCitiesRequest {}

message ListCitiesResponse {
  repeated City cities = 1;
}

message GetCityRequest {
  string city_id = 1;
}

message CityResponse {
  City city = 1;
}

message CreateCityRequest {
  string name = 1;
  map<string, string> names = 2;
  string time_zone = 3;
  Coordinates center = 4;
}

// UpdateCity replaces the name, the translations, the time zone and the
// center.
message UpdateCityRequest {
  string city_id = 1;
  string name = 2;
  map<string, string> names = 3;
  string time_zone = 4;
  Coordinates center = 5;
}

message SetCityActiveRequest {
  string city_id = 1;
  bool active = 2;
}

// --- Curated places ------------------------------------------------------

enum PlaceCategory {
  PLACE_CATEGORY_UNSPECIFIED = 0;
  PLACE_CATEGORY_AIRPORT = 1;
  PLACE_CATEGORY_MALL = 2;
  PLACE_CATEGORY_HOTEL = 3;
  PLACE_CATEGORY_HOSPITAL = 4;
  PLACE_CATEGORY_UNIVERSITY = 5;
  PLACE_CATEGORY_LANDMARK = 6;
  PLACE_CATEGORY_STATION = 7;
  PLACE_CATEGORY_GOVERNMENT = 8;
  PLACE_CATEGORY_RESTAURANT = 9;
  PLACE_CATEGORY_OTHER = 10;
}

message CuratedPlace {
  string id = 1;
  string city_id = 2;
  PlaceCategory category = 3;
  // The name used when no translation fits.
  string name = 4;
  // The name in other languages, by language: "ar", "ku", "en".
  map<string, string> names = 5;
  // A short address or directions ("Main gate, 100m Street").
  string address = 6;
  // The exact point to be picked up or dropped at (a gate, an entrance).
  Coordinates coordinates = 7;
  // Higher first, in lists and search.
  int32 priority = 8;
  bool active = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListPlacesRequest {
  // Optional filters.
  string city_id = 1;
  PlaceCategory category = 2;
  // When set, closer places come first after priority.
  Coordinates near = 3;
  // At most 100; 20 by default.
  int32 page_size = 4;
  string page_token = 5;
}

message AdminListPlacesRequest {
  string city_id = 1;
  PlaceCategory category = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListPlacesResponse {
  repeated CuratedPlace places = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetPlaceRequest {
  string place_id = 1;
}

message CuratedPlaceResponse {
  CuratedPlace place = 1;
}

message CreatePlaceRequest {
  string city_id = 1;
  PlaceCategory category = 2;
  string name = 3;
  map<string, string> names = 4;
  string address = 5;
  Coordinates coordinates = 6;
  int32 priority = 7;
}

// UpdatePlace replaces everything but the city.
message UpdatePlaceRequest {
  string place_id = 1;
  PlaceCategory category = 2;
  string name = 3;
  map<string, string> names = 4;
  string address = 5;
  Coordinates coordinates = 6;
  int32 priority = 7;
}

message SetPlaceActiveRequest {
  string place_id = 1;
  bool active = 2;
}

message GetRouteRequest {
  Coordinates origin = 1;
  Coordinates destination = 2;
  // Points to pass through on the way, in order; at most 5.
  repeated Coordinates via = 3;
}

message GetRouteResponse {
  double distance_meters = 1;
  double duration_seconds = 2;

  // The whole path as a Google encoded polyline with 5 digits of precision (about a
  // metre), ready to decode and draw.
  string polyline = 3;
}

message SearchPlacesRequest {
  // What to look for; 2 to 200 characters.
  string query = 1;

  // When set, places close to it are ranked first (others are not excluded).
  Coordinates near = 2;

  // How many places to return: 5 by default, at most 10.
  int32 limit = 3;

  // The language names are given in: "ar", "ku" or "en". Empty means Arabic, then
  // Kurdish, then English.
  string language = 4;
}

message SearchPlacesResponse {
  repeated Place places = 1;
}

message ReverseGeocodeRequest {
  Coordinates coordinates = 1;
  string language = 2;
}

message ReverseGeocodeResponse {
  Place place = 1;
}

message Place {
  // The OpenStreetMap object, for example "way/123456", or "curated/<id>" for
  // a curated place.
  string id = 1;

  // The short name (a mall, a street) and the full one with neighbourhood, city and
  // country.
  string name = 2;
  string display_name = 3;

  string category = 4;
  string type = 5;
  Coordinates coordinates = 6;

  // The parts of the address that are known (road, neighbourhood, suburb, city, state,
  // postcode...), by OpenStreetMap's own names.
  map<string, string> address = 7;

  // Set for a curated place (see CuratedPlace): its id, and category is then
  // the curated category in lower case ("airport", "mall"...).
  string curated_place_id = 8;
}
