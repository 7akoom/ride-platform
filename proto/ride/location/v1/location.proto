syntax = "proto3";

package ride.location.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/location/v1;locationv1";

service LocationService {
  // UpdateLocation reports the caller's own position (driver app, every few seconds).
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse) {
    option (google.api.http) = {
      put: "/v1/locations/{entity_id}"
      body: "*"
    };
  }
  // GetLocation is the rider app's poll target for a driver's live
  // position during an active trip (entity_type=ENTITY_TYPE_DRIVER).
  // entity_type isn't in the path because grpc-gateway can't bind an
  // enum's string value there reliably — it comes through as a normal
  // query param (?entity_type=ENTITY_TYPE_DRIVER) instead.
  rpc GetLocation(GetLocationRequest) returns (GetLocationResponse) {
    option (google.api.http) = {
      get: "/v1/locations/{entity_id}"
    };
  }
  rpc FindNearby(FindNearbyRequest) returns (FindNearbyResponse);

  // Service zones — the geographic areas the platform actually serves,
  // down to arbitrary polygons (not just a city name). See
  // CheckServiceZone for the query every trip request must pass.
  // CreateZone, UpdateZone and SetZoneActive change the served map: staff with
  // zones.manage, or the internal token.
  rpc CreateZone(CreateZoneRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      post: "/v1/admin/zones"
      body: "*"
    };
  }
  rpc UpdateZone(UpdateZoneRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/zones/{zone_id}"
      body: "*"
    };
  }
  rpc SetZoneActive(SetZoneActiveRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      post: "/v1/admin/zones/{zone_id}:setActive"
      body: "*"
    };
  }
  // GetZone reads one service zone.
  rpc GetZone(GetZoneRequest) returns (ZoneResponse) {
    option (google.api.http) = {
      get: "/v1/zones/{zone_id}"
    };
  }
  // ListZones lists service zones, optionally for one city (?city=).
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse) {
    option (google.api.http) = {
      get: "/v1/zones"
    };
  }
  // CheckServiceZone tells whether a point is served (?coordinates.latitude=&coordinates.longitude=).
  rpc CheckServiceZone(CheckServiceZoneRequest) returns (CheckServiceZoneResponse) {
    option (google.api.http) = {
      get: "/v1/zones:check"
    };
  }

  // GetRoute returns the best route by road between two points: how far, how long, and
  // the line to draw on a map. Any signed-in user may ask.
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse) {
    option (google.api.http) = {
      post: "/v1/routes:compute"
      body: "*"
    };
  }

  // SearchPlaces finds places (a mall, a street, a neighbourhood) by name, best match
  // first. Any signed-in user may ask.
  rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse) {
    option (google.api.http) = {
      get: "/v1/places:search"
    };
  }

  // ReverseGeocode names what is at a point. Any signed-in user may ask.
  rpc ReverseGeocode(ReverseGeocodeRequest) returns (ReverseGeocodeResponse) {
    option (google.api.http) = {
      get: "/v1/places:reverse"
    };
  }
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_DRIVER = 1;
  ENTITY_TYPE_RIDER = 2;
}

message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

message UpdateLocationRequest {
  EntityType entity_type = 1;
  string entity_id = 2;
  Coordinates coordinates = 3;
}

message UpdateLocationResponse {
  google.protobuf.Timestamp updated_at = 1;
}

message GetLocationRequest {
  EntityType entity_type = 1;
  string entity_id = 2;
}

message GetLocationResponse {
  Coordinates coordinates = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message NearbyEntity {
  string entity_id = 1;
  Coordinates coordinates = 2;
  double distance_meters = 3;
}

message FindNearbyRequest {
  EntityType entity_type = 1;
  Coordinates coordinates = 2;
  double radius_meters = 3;
  int32 limit = 4;
}

message FindNearbyResponse {
  repeated NearbyEntity entities = 1;
}

// --- Service zones ---------------------------------------------------
//
// A zone is an arbitrary polygon within a city, not the city itself —
// two zones can share a city name (e.g. distinct approved areas within
// Erbil). boundary is an ordered list of vertices forming a simple
// polygon (first point is not repeated at the end).

message Zone {
  string id = 1;
  string city = 2;
  string name = 3;
  repeated Coordinates boundary = 4;
  bool active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateZoneRequest {
  string city = 1;
  string name = 2;
  repeated Coordinates boundary = 3;
}

message UpdateZoneRequest {
  string zone_id = 1;
  string name = 2;
  repeated Coordinates boundary = 3;
}

message SetZoneActiveRequest {
  string zone_id = 1;
  bool active = 2;
}

message ZoneResponse {
  Zone zone = 1;
}

message GetZoneRequest {
  string zone_id = 1;
}

message ListZonesRequest {
  // Optional. Empty returns zones for every city.
  string city = 1;
}

message ListZonesResponse {
  repeated Zone zones = 1;
}

message CheckServiceZoneRequest {
  Coordinates coordinates = 1;
}

message CheckServiceZoneResponse {
  bool served = 1;
  // zone_id/city are only set when served is true.
  string zone_id = 2;
  string city = 3;
}

message GetRouteRequest {
  Coordinates origin = 1;
  Coordinates destination = 2;
}

message GetRouteResponse {
  double distance_meters = 1;
  double duration_seconds = 2;

  // The whole path as a Google encoded polyline with 5 digits of precision (about a
  // metre), ready to decode and draw.
  string polyline = 3;
}

message SearchPlacesRequest {
  // What to look for; 2 to 200 characters.
  string query = 1;

  // When set, places close to it are ranked first (others are not excluded).
  Coordinates near = 2;

  // How many places to return: 5 by default, at most 10.
  int32 limit = 3;

  // The language names are given in: "ar", "ku" or "en". Empty means Arabic, then
  // Kurdish, then English.
  string language = 4;
}

message SearchPlacesResponse {
  repeated Place places = 1;
}

message ReverseGeocodeRequest {
  Coordinates coordinates = 1;
  string language = 2;
}

message ReverseGeocodeResponse {
  Place place = 1;
}

message Place {
  // The OpenStreetMap object, for example "way/123456".
  string id = 1;

  // The short name (a mall, a street) and the full one with neighbourhood, city and
  // country.
  string name = 2;
  string display_name = 3;

  string category = 4;
  string type = 5;
  Coordinates coordinates = 6;

  // The parts of the address that are known (road, neighbourhood, suburb, city, state,
  // postcode...), by OpenStreetMap's own names.
  map<string, string> address = 7;
}
