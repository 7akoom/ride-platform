syntax = "proto3";

package ride.wallet.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/wallet/v1;walletv1";

service WalletService {
  // GetWallet returns the caller's own wallet: ?owner_type=OWNER_TYPE_RIDER or OWNER_TYPE_DRIVER.
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{owner_id}"
    };
  }
  rpc TopUp(TopUpRequest) returns (TopUpResponse);
  rpc SettleTrip(SettleTripRequest) returns (SettleTripResponse);
  // ListTransactions lists the caller's own wallet history: ?owner_type=&limit=.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{owner_id}/transactions"
    };
  }
  // CheckDriverStanding tells a driver whether they can take trips and how much to deposit if not.
  rpc CheckDriverStanding(CheckDriverStandingRequest) returns (CheckDriverStandingResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/standing"
    };
  }
  // RequestPayout asks for the driver's own money: the amount is held (it
  // leaves the balance now) and a payout request waits for staff, who pay it
  // outside the platform and mark it paid, or reject it (the money comes
  // back). One open request at a time; idempotency_key makes a retry safe.
  rpc RequestPayout(RequestPayoutRequest) returns (RequestPayoutResponse) {
    option (google.api.http) = {
      post: "/v1/drivers/{driver_id}/payouts"
      body: "*"
    };
  }
  // ListPayouts is the driver's own payout requests, newest first.
  rpc ListPayouts(ListPayoutsRequest) returns (ListPayoutsResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/payouts"
    };
  }

  // GetTripSettlement tells how a settled trip's fare was paid: what left the rider's
  // wallet and how much cash the driver collects. ?owner_type=&owner_id= is the caller's
  // own wallet, and only the rider and the driver of the trip can read it (anyone else,
  // like a trip that is not settled yet, gets NOT_FOUND). A driver also sees the
  // commission and their earning; a rider does not.
  rpc GetTripSettlement(GetTripSettlementRequest) returns (GetTripSettlementResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{owner_id}/trips/{trip_id}/settlement"
    };
  }

  // RecordTripChange is how a driver reports that the rider handed over more cash than the
  // trip's cash part and there was no change to give back: the difference is credited to the
  // rider's wallet. The driver sends only cash_received (all the cash handed over); the change
  // is worked out here. The platform pays: nothing is taken from the driver. Only the trip's
  // own driver, after the trip is settled, once per trip (the same amount again is harmless),
  // and at most the deployment's max_change_credit.
  rpc RecordTripChange(RecordTripChangeRequest) returns (RecordTripChangeResponse) {
    option (google.api.http) = {
      post: "/v1/drivers/{driver_id}/trips/{trip_id}/change"
      body: "*"
    };
  }

  // InitiateTopUp starts a top-up of the caller's own wallet (a rider's or
  // a driver's) through a payment provider (zaincash, the default): a
  // pending record and a payment session on the provider's own page, whose
  // URL the app opens. The customer pays there, so a card number or a
  // wallet PIN never reaches the platform. The wallet is credited when the
  // provider's notification says the payment succeeded; GetTopUp tells the
  // app how it ended. Within the deployment's top-up limits.
  rpc InitiateTopUp(InitiateTopUpRequest) returns (InitiateTopUpResponse) {
    option (google.api.http) = {
      post: "/v1/wallet/topups/zaincash"
      body: "*"
      additional_bindings {
        post: "/v1/wallets/{owner_id}/topups"
        body: "*"
      }
    };
  }
  rpc GetTopUp(GetTopUpRequest) returns (GetTopUpResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{owner_id}/topups/{top_up_id}"
    };
  }

  // TipDriver gives the trip's driver a tip from the rider's wallet: once
  // per trip, within 72 hours of a completed (settled) trip, within the
  // deployment's tip limits; the driver gets all of it (no commission). The
  // same idempotency_key again is the same tip.
  rpc TipDriver(TipDriverRequest) returns (TipDriverResponse) {
    option (google.api.http) = {
      post: "/v1/wallets/{rider_id}/trips/{trip_id}/tip"
      body: "*"
    };
  }

  // SendTransfer sends money from the rider's wallet to another registered
  // rider's, by the phone the other signs in with (E.164, e.g.
  // +9647701234567), confirmed with the sender's wallet PIN. The same
  // idempotency_key again is the same transfer (never a second one); with
  // another recipient or amount it is refused. Limits: the least and most
  // one transfer may move, and how much and how many in any 24 hours
  // (wallet config). The recipient is told (push).
  rpc SendTransfer(SendTransferRequest) returns (SendTransferResponse) {
    option (google.api.http) = {
      post: "/v1/wallets/{rider_id}/transfers"
      body: "*"
    };
  }

  // ListTransfers is the rider's transfers, sent and received, newest first.
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{rider_id}/transfers"
    };
  }

  // Money requests: a rider asks for money, from one registered rider (by
  // phone: they are told) or from whoever opens its code (a link or a QR
  // code built from the code). Paying one is a transfer from the payer with
  // their PIN, within the transfer limits. It stays pending until paid,
  // declined (by the rider it is for), cancelled (by the requester) or it
  // expires (72 hours by default, 1-168).
  rpc CreateMoneyRequest(CreateMoneyRequestRequest) returns (MoneyRequestResponse) {
    option (google.api.http) = {
      post: "/v1/wallets/{rider_id}/money-requests"
      body: "*"
    };
  }
  // ListMoneyRequests: role outgoing (asked by this rider) or incoming (for
  // this rider, or paid by them); status pending, paid, declined, cancelled
  // or expired. Newest first.
  rpc ListMoneyRequests(ListMoneyRequestsRequest) returns (ListMoneyRequestsResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{rider_id}/money-requests"
    };
  }
  // GetMoneyRequest opens a request by its code (after scanning its QR code
  // or following its link). A request for one rider is seen only by that
  // rider and the requester.
  rpc GetMoneyRequest(GetMoneyRequestRequest) returns (MoneyRequestResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{rider_id}/money-requests/{code}"
    };
  }
  rpc PayMoneyRequest(PayMoneyRequestRequest) returns (PayMoneyRequestResponse) {
    option (google.api.http) = {
      post: "/v1/wallets/{rider_id}/money-requests/{code}:pay"
      body: "*"
    };
  }
  rpc DeclineMoneyRequest(CloseMoneyRequestRequest) returns (MoneyRequestResponse) {
    option (google.api.http) = {
      post: "/v1/wallets/{rider_id}/money-requests/{code}:decline"
      body: "*"
    };
  }
  rpc CancelMoneyRequest(CloseMoneyRequestRequest) returns (MoneyRequestResponse) {
    option (google.api.http) = {
      post: "/v1/wallets/{rider_id}/money-requests/{code}:cancel"
      body: "*"
    };
  }

  // GetStatement is the wallet's ledger for a period, with the balance
  // before and after it and what came in and went out. direction in / out
  // and types narrow the entries (and the totals); the opening and closing
  // balances are the wallet's, whatever the filter. Newest first.
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{owner_id}/statement"
    };
  }

  // GetRiderDues is what a rider still owes from cancelled trips' fees (the
  // money reaching their wallet pays it off first), and whether they may
  // request trips meanwhile (trip-service asks, with the internal token).
  rpc GetRiderDues(GetRiderDuesRequest) returns (GetRiderDuesResponse) {
    option (google.api.http) = {
      get: "/v1/wallets/{rider_id}/dues"
    };
  }

  // Vouchers: prepaid codes the platform issues in batches and sells through
  // a seller (ZainCash, shops); a rider types one in to credit their wallet.
  // Staff with vouchers.manage create a batch (its codes are generated here
  // and kept encrypted), export it ONCE (the only time the codes are shown;
  // after that only their hashes remain), and may cancel a batch or void one
  // voucher. A voucher is redeemable once its batch is exported, until it
  // expires, once.
  rpc CreateVoucherBatch(CreateVoucherBatchRequest) returns (VoucherBatchResponse) {
    option (google.api.http) = {
      post: "/v1/admin/voucher-batches"
      body: "*"
    };
  }
  // ListVoucherBatches: newest first; status created, exported or cancelled.
  rpc ListVoucherBatches(ListVoucherBatchesRequest) returns (ListVoucherBatchesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/voucher-batches"
    };
  }
  rpc GetVoucherBatch(GetVoucherBatchRequest) returns (VoucherBatchResponse) {
    option (google.api.http) = {
      get: "/v1/admin/voucher-batches/{batch_id}"
    };
  }
  // ExportVoucherBatch returns every code of a created batch, once, and makes
  // the batch redeemable. The codes are not kept: a lost export is a batch to
  // cancel and issue again.
  rpc ExportVoucherBatch(ExportVoucherBatchRequest) returns (ExportVoucherBatchResponse) {
    option (google.api.http) = {
      post: "/v1/admin/voucher-batches/{batch_id}:export"
      body: "*"
    };
  }
  // CancelVoucherBatch stops every voucher of the batch not redeemed yet.
  rpc CancelVoucherBatch(CancelVoucherBatchRequest) returns (VoucherBatchResponse) {
    option (google.api.http) = {
      post: "/v1/admin/voucher-batches/{batch_id}:cancel"
      body: "*"
    };
  }
  // GetVoucher looks one voucher up by the serial printed next to its code.
  rpc GetVoucher(GetVoucherRequest) returns (VoucherResponse) {
    option (google.api.http) = {
      get: "/v1/admin/vouchers/{serial}"
    };
  }
  // VoidVoucher stops one voucher not redeemed yet (a card reported lost).
  rpc VoidVoucher(VoidVoucherRequest) returns (VoucherResponse) {
    option (google.api.http) = {
      post: "/v1/admin/vouchers/{serial}:void"
      body: "*"
    };
  }
  // RedeemVoucher credits the rider's wallet with a voucher's amount (what
  // they owe from cancelled trips' fees is paid from it first). The same
  // rider redeeming the same code again gets the same redemption back.
  // Wrong codes are counted: after too many in a while the rider waits
  // (RESOURCE_EXHAUSTED).
  rpc RedeemVoucher(RedeemVoucherRequest) returns (RedeemVoucherResponse) {
    option (google.api.http) = {
      post: "/v1/wallets/{rider_id}/vouchers:redeem"
      body: "*"
    };
  }

  // Staff money operations. wallets.read: look at any wallet and its
  // statement. wallets.adjust: correct a balance, refund a trip.
  // payouts.manage: work the payout queue. Every call is audited.
  rpc InspectWallet(InspectWalletRequest) returns (InspectWalletResponse) {
    option (google.api.http) = {
      get: "/v1/admin/wallets/{owner_id}"
    };
  }
  rpc GetStatementForStaff(GetStatementRequest) returns (GetStatementResponse) {
    option (google.api.http) = {
      get: "/v1/admin/wallets/{owner_id}/statement"
    };
  }
  // AdjustWallet credits (positive) or debits (negative) a wallet with a
  // reason: an adjustment row. A rider's balance never goes below zero; a
  // driver's may (their commission balance), with the suspension rule.
  rpc AdjustWallet(AdjustWalletRequest) returns (AdjustmentResponse) {
    option (google.api.http) = {
      post: "/v1/admin/wallets/{owner_id}/adjustments"
      body: "*"
    };
  }
  // RefundTrip gives a rider back money for a settled trip (or a cancelled
  // trip's fee), paid by the platform, or partly taken back from the driver
  // (driver_amount). All the refunds of a trip add up to at most its fare (or
  // fee). Like any money reaching the wallet it pays unpaid fees first, so
  // refunding a fee still owed waives it.
  rpc RefundTrip(RefundTripRequest) returns (AdjustmentResponse) {
    option (google.api.http) = {
      post: "/v1/admin/trips/{trip_id}/refunds"
      body: "*"
    };
  }
  rpc ListTripRefunds(ListTripRefundsRequest) returns (ListTripRefundsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/trips/{trip_id}/refunds"
    };
  }
  // The payout queue: status pending, approved, paid or rejected; oldest
  // first, so the queue is worked in order.
  rpc ListPayoutRequests(ListPayoutRequestsRequest) returns (ListPayoutsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/payouts"
    };
  }
  rpc ApprovePayout(ApprovePayoutRequest) returns (PayoutResponse) {
    option (google.api.http) = {
      post: "/v1/admin/payouts/{payout_id}:approve"
      body: "*"
    };
  }
  // MarkPayoutPaid records that the money reached the driver (a pending or
  // approved request), with the transfer's reference.
  rpc MarkPayoutPaid(MarkPayoutPaidRequest) returns (PayoutResponse) {
    option (google.api.http) = {
      post: "/v1/admin/payouts/{payout_id}:markPaid"
      body: "*"
    };
  }
  // RejectPayout gives the held amount back to the driver's wallet.
  rpc RejectPayout(RejectPayoutRequest) returns (PayoutResponse) {
    option (google.api.http) = {
      post: "/v1/admin/payouts/{payout_id}:reject"
      body: "*"
    };
  }

  // ProcessZainCashWebhook receives ZainCash's server-to-server payment
  // notification. Called directly by ZainCash, not by an authenticated
  // platform client — exempted from the auth interceptor same as the
  // health check (see authentication_interceptor.go).
  rpc ProcessZainCashWebhook(ProcessZainCashWebhookRequest) returns (ProcessZainCashWebhookResponse) {
    option (google.api.http) = {
      post: "/v1/wallet/zaincash/webhook"
      body: "*"
    };
  }
}

enum OwnerType {
  OWNER_TYPE_UNSPECIFIED = 0;
  OWNER_TYPE_RIDER = 1;
  OWNER_TYPE_DRIVER = 2;
}

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CASH = 1;
  PAYMENT_METHOD_WALLET = 2;
  PAYMENT_METHOD_CARD = 3;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_TOP_UP = 1;
  TRANSACTION_TYPE_TRIP_PAYMENT = 2;
  TRANSACTION_TYPE_TRIP_EARNING = 3;
  TRANSACTION_TYPE_COMMISSION = 4;
  TRANSACTION_TYPE_PAYOUT = 5;
  TRANSACTION_TYPE_ADJUSTMENT = 6;
  // Change the driver could not return in cash, credited to the rider's wallet.
  TRANSACTION_TYPE_CHANGE_CREDIT = 7;
  // Money sent to another rider, and received from one.
  TRANSACTION_TYPE_TRANSFER_OUT = 8;
  TRANSACTION_TYPE_TRANSFER_IN = 9;
  // A cancelled trip's fee the rider owed, paid from money that reached the
  // wallet later.
  TRANSACTION_TYPE_DUE_PAYMENT = 10;
  // A voucher redeemed into the rider's wallet.
  TRANSACTION_TYPE_VOUCHER = 11;
  // Money given back for a trip (to the rider; from the driver when they
  // share it).
  TRANSACTION_TYPE_REFUND = 12;
  // A rejected payout's held amount, back in the driver's wallet.
  TRANSACTION_TYPE_PAYOUT_RETURN = 13;
  // A tip: out of the rider's wallet, into the driver's.
  TRANSACTION_TYPE_TIP = 14;
}

message Wallet {
  string id = 1;
  OwnerType owner_type = 2;
  string owner_id = 3;
  string currency_code = 4;
  // Decimal string (e.g. "2451.6") — never a float, to avoid any
  // precision loss crossing the wire.
  string balance = 5;
  bool blocked = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Transaction {
  string id = 1;
  string wallet_id = 2;
  TransactionType type = 3;
  // Signed decimal string: negative means money left the wallet.
  string amount = 4;
  string balance_after = 5;
  string trip_id = 6;
  string description = 7;
  google.protobuf.Timestamp created_at = 8;
  // The transfer a transfer_out / transfer_in row is one side of.
  string transfer_id = 9;
}

message GetWalletRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message TopUpRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
  string amount = 3;
  // Caller-supplied unique key so a retried top-up can't double-credit.
  string idempotency_key = 4;
  string description = 5;
}

message TopUpResponse {
  Wallet wallet = 1;
  Transaction transaction = 2;
}

message SettleTripRequest {
  string trip_id = 1;
  string rider_id = 2;
  string driver_id = 3;
  string fare_amount = 4;
  PaymentMethod payment_method = 5;
}

message SettleTripResponse {
  string trip_id = 1;
  string fare_amount = 2;
  string commission_amount = 3;
  string driver_earning = 4;
  string rider_balance = 5;
  string driver_balance = 6;
}

message ListTransactionsRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
  int32 limit = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
}

message CheckDriverStandingRequest {
  string driver_id = 1;
}

// A driver works on a prepaid commission balance: they deposit money up
// front, commission is drawn from it, and once the balance falls to the
// suspension threshold their account stops receiving trips entirely
// until they top up again.
message CheckDriverStandingResponse {
  // False means: assign no trips to this driver at all.
  bool can_take_trips = 1;
  bool suspended = 2;
  string current_balance = 3;
  // Balance at or below which the account is suspended (negative or zero).
  string suspension_threshold = 4;
  // How much the driver must deposit to get back above the threshold.
  // Zero when they are in good standing.
  string amount_due = 5;
  string reason = 6;
}

message RequestPayoutRequest {
  string driver_id = 1;
  string amount = 2;
  string idempotency_key = 3;
  // Where the money should go (a ZainCash number, "cash at the office"...),
  // at most 120 characters, shown to staff.
  string destination = 4;
}

message RequestPayoutResponse {
  Wallet wallet = 1;
  // The hold: the payout row of the driver's ledger.
  Transaction transaction = 2;
  Payout payout = 3;
}

message Payout {
  string id = 1;
  string driver_id = 2;
  string amount = 3;
  string currency_code = 4;
  string destination = 5;
  // pending, approved, paid or rejected.
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp approved_at = 8;
  google.protobuf.Timestamp paid_at = 9;
  // The transfer's reference, once paid.
  string paid_reference = 10;
  google.protobuf.Timestamp rejected_at = 11;
  string reject_reason = 12;
}

message PayoutResponse {
  Payout payout = 1;
}

message ListPayoutsRequest {
  string driver_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPayoutsResponse {
  repeated Payout payouts = 1;
  string next_page_token = 2;
}

message ListPayoutRequestsRequest {
  // Empty for every status.
  string status = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ApprovePayoutRequest {
  string payout_id = 1;
}

message MarkPayoutPaidRequest {
  string payout_id = 1;
  // The transfer's reference (ZainCash transaction id, receipt number...),
  // 1-120 characters.
  string reference = 2;
}

message RejectPayoutRequest {
  string payout_id = 1;
  // Why, 3-300 characters; the driver sees it.
  string reason = 2;
}

message InitiateTopUpRequest {
  // The driver topping up (the older form; owner_type and owner_id say the
  // same for any wallet).
  string driver_id = 1;
  // Decimal string, e.g. "25000".
  string amount = 2;
  OwnerType owner_type = 3;
  string owner_id = 4;
  // The payment provider; empty means zaincash.
  string provider = 5;
}

message InitiateTopUpResponse {
  string top_up_id = 1;
  // pending | succeeded | failed
  string status = 2;
  string redirect_url = 3;
}

message GetTopUpRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
  string top_up_id = 3;
}

message GetTopUpResponse {
  string top_up_id = 1;
  string provider = 2;
  // pending | succeeded | failed
  string status = 3;
  string amount = 4;
  string currency_code = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ProcessZainCashWebhookRequest {
  // The raw JWT ZainCash sends (their "token" field).
  string token = 1;
}

message ProcessZainCashWebhookResponse {}

message GetTripSettlementRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
  string trip_id = 3;
}

message GetTripSettlementResponse {
  string trip_id = 1;
  PaymentMethod payment_method = 2;
  string currency_code = 3;
  // Decimal strings, like every money field.
  string fare_amount = 4;
  // What left the rider's wallet.
  string wallet_amount = 5;
  // What the rider hands the driver in cash.
  string cash_amount = 6;
  // Only filled for the driver's own view.
  string commission_amount = 7;
  string driver_earning = 8;
  // The change credited to the rider's wallet because the driver had none. "0" if none.
  string change_amount = 9;
  // trip, or cancellation / no_show for the fee of a cancelled trip. A fee
  // is taken from the rider's wallet; what the wallet could not cover is
  // due_amount, still owed by the rider.
  string kind = 10;
  string due_amount = 11;
  // How much of due_amount is paid since (from money that reached the
  // rider's wallet).
  string due_paid = 12;
  // What the rider tipped the driver for this trip. "0" if nothing.
  string tip_amount = 13;
}

message RecordTripChangeRequest {
  string driver_id = 1;
  string trip_id = 2;
  // Decimal string: all the cash the rider handed over for this trip.
  string cash_received = 3;
}

message RecordTripChangeResponse {
  string trip_id = 1;
  string currency_code = 2;
  // The cash part of the fare, what the rider handed over, and the difference credited.
  string cash_due = 3;
  string cash_received = 4;
  string change_amount = 5;
}

message SendTransferRequest {
  // The sender: the caller's own rider profile.
  string rider_id = 1;
  // The recipient's phone, E.164.
  string recipient_phone = 2;
  // Decimal string.
  string amount = 3;
  // At most 140 characters, shown to both.
  string note = 4;
  // The sender's wallet PIN.
  string pin = 5;
  // Required: a retry with the same key is the same transfer.
  string idempotency_key = 6;
}

// Transfer is seen from one rider's side: direction is sent or received and
// counterpart_phone is the other rider's phone.
message Transfer {
  string id = 1;
  string direction = 2;
  string counterpart_phone = 3;
  string amount = 4;
  string currency_code = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message SendTransferResponse {
  Transfer transfer = 1;
  // The sender's wallet after it.
  Wallet wallet = 2;
}

message ListTransfersRequest {
  string rider_id = 1;
  // Default 20, at most 100.
  int32 page_size = 2;
  string page_token = 3;
}

message ListTransfersResponse {
  repeated Transfer transfers = 1;
  string next_page_token = 2;
}

message CreateMoneyRequestRequest {
  // The requester: the caller's own rider profile.
  string rider_id = 1;
  // The rider asked (E.164); empty for an open request anyone with the code
  // may pay.
  string payer_phone = 2;
  string amount = 3;
  string note = 4;
  // 1-168; 0 means 72.
  int32 expires_in_hours = 5;
  // Required: a retry with the same key is the same request.
  string idempotency_key = 6;
}

// MoneyRequest is seen from one rider's side: role is requester or payer (the
// rider it is for, or who paid it), or viewer for an open request someone
// else asked for.
message MoneyRequest {
  string id = 1;
  string code = 2;
  string role = 3;
  // True when anyone with the code may pay it.
  bool open = 4;
  string requester_phone = 5;
  string payer_phone = 6;
  string amount = 7;
  string currency_code = 8;
  string note = 9;
  // pending, paid, declined, cancelled or expired.
  string status = 10;
  string transfer_id = 11;
  google.protobuf.Timestamp expires_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp closed_at = 14;
}

message MoneyRequestResponse {
  MoneyRequest money_request = 1;
}

message ListMoneyRequestsRequest {
  string rider_id = 1;
  string role = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListMoneyRequestsResponse {
  repeated MoneyRequest money_requests = 1;
  string next_page_token = 2;
}

message GetMoneyRequestRequest {
  string rider_id = 1;
  string code = 2;
}

message PayMoneyRequestRequest {
  // The payer: the caller's own rider profile.
  string rider_id = 1;
  string code = 2;
  string pin = 3;
}

message PayMoneyRequestResponse {
  MoneyRequest money_request = 1;
  Transfer transfer = 2;
  Wallet wallet = 3;
}

message CloseMoneyRequestRequest {
  string rider_id = 1;
  string code = 2;
}

message GetStatementRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
  // in (money came in), out (money went out), or empty for both.
  string direction = 3;
  repeated TransactionType types = 4;
  // The period; from defaults to 30 days before to, to to now.
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message GetStatementResponse {
  repeated Transaction entries = 1;
  string next_page_token = 2;
  string currency_code = 3;
  // The balance before the period and at its end.
  string opening_balance = 4;
  string closing_balance = 5;
  // What came in and what went out during the period (of the entries the
  // filter keeps), both positive.
  string total_in = 6;
  string total_out = 7;
}

message GetRiderDuesRequest {
  string rider_id = 1;
}

message RiderDue {
  string trip_id = 1;
  // cancellation or no_show.
  string kind = 2;
  string amount = 3;
  string paid = 4;
  string outstanding = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetRiderDuesResponse {
  string currency_code = 1;
  string outstanding = 2;
  repeated RiderDue dues = 3;
  // False when the deployment blocks trips until the fees are paid.
  bool can_request_trips = 4;
}

message CreateVoucherBatchRequest {
  // What staff call the batch, e.g. "ZainCash October 5000".
  string label = 1;
  // Who sells it (e.g. zaincash); free text, at most 60 characters.
  string seller = 2;
  // What each voucher credits, a decimal string in the deployment's currency.
  string amount = 3;
  // 1-10000.
  int32 quantity = 4;
  // When the vouchers stop working: at least an hour and at most three years
  // ahead; unset means a year.
  google.protobuf.Timestamp expires_at = 5;
  // Required: a retry with the same key is the same batch.
  string idempotency_key = 6;
}

message VoucherBatch {
  string id = 1;
  // The batch's number, the start of every serial (V<number>-<index>).
  int64 number = 2;
  string label = 3;
  string seller = 4;
  string amount = 5;
  string currency_code = 6;
  int32 quantity = 7;
  // created (codes not exported yet: nothing is redeemable), exported
  // (redeemable) or cancelled.
  string status = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp exported_at = 11;
  google.protobuf.Timestamp cancelled_at = 12;
  string cancel_reason = 13;
  // How the vouchers stand.
  int32 redeemed_count = 14;
  int32 void_count = 15;
  string redeemed_amount = 16;
}

message VoucherBatchResponse {
  VoucherBatch batch = 1;
}

message ListVoucherBatchesRequest {
  string status = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListVoucherBatchesResponse {
  repeated VoucherBatch batches = 1;
  string next_page_token = 2;
}

message GetVoucherBatchRequest {
  string batch_id = 1;
}

message ExportVoucherBatchRequest {
  string batch_id = 1;
}

message ExportedVoucher {
  string serial = 1;
  // The code riders type, grouped in fours (XXXX-XXXX-XXXX-XXXX).
  string code = 2;
}

message ExportVoucherBatchResponse {
  VoucherBatch batch = 1;
  repeated ExportedVoucher vouchers = 2;
  // The same as CSV (serial,code,amount,currency,expires_at) for the seller.
  string csv = 3;
}

message CancelVoucherBatchRequest {
  string batch_id = 1;
  // Why, 3-300 characters, kept with the batch.
  string reason = 2;
}

message Voucher {
  string serial = 1;
  string batch_id = 2;
  string batch_label = 3;
  string amount = 4;
  string currency_code = 5;
  // available, redeemed or void.
  string status = 6;
  // True when a rider could redeem it now: available, its batch exported and
  // not cancelled, and not expired.
  bool redeemable = 7;
  google.protobuf.Timestamp expires_at = 8;
  string redeemed_by_rider_id = 9;
  google.protobuf.Timestamp redeemed_at = 10;
  string transaction_id = 11;
  google.protobuf.Timestamp voided_at = 12;
  string void_reason = 13;
}

message VoucherResponse {
  Voucher voucher = 1;
}

message GetVoucherRequest {
  string serial = 1;
}

message VoidVoucherRequest {
  string serial = 1;
  // Why, 3-300 characters.
  string reason = 2;
}

message RedeemVoucherRequest {
  // The caller's own rider profile.
  string rider_id = 1;
  // As printed; spaces, dashes and case do not matter.
  string code = 2;
}

message RedeemVoucherResponse {
  string serial = 1;
  string amount = 2;
  string currency_code = 3;
  // The rider's wallet after it.
  Wallet wallet = 4;
  // The voucher's ledger row.
  Transaction transaction = 5;
}

message InspectWalletRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
}

message InspectWalletResponse {
  Wallet wallet = 1;
  // The latest 20 ledger rows, newest first.
  repeated Transaction recent_transactions = 2;
  // A rider's unpaid trip fees.
  string outstanding_dues = 3;
  // A driver's payout requests still open (pending or approved).
  repeated Payout open_payouts = 4;
}

message AdjustWalletRequest {
  OwnerType owner_type = 1;
  string owner_id = 2;
  // Signed decimal string: positive credits, negative debits.
  string amount = 3;
  // Why, 3-300 characters, written on the ledger row.
  string reason = 4;
  // Required: a retry with the same key is the same adjustment.
  string idempotency_key = 5;
}

// Adjustment is a staff member's correction or refund.
message Adjustment {
  string id = 1;
  // adjustment or refund.
  string kind = 2;
  OwnerType owner_type = 3;
  string owner_id = 4;
  string amount = 5;
  string currency_code = 6;
  string trip_id = 7;
  // For a refund: what was taken back from the driver.
  string driver_id = 8;
  string driver_amount = 9;
  string reason = 10;
  string transaction_id = 11;
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
}

message AdjustmentResponse {
  Adjustment adjustment = 1;
  // The wallet credited or debited (the rider's, for a refund).
  Wallet wallet = 2;
}

message RefundTripRequest {
  string trip_id = 1;
  // What the rider gets back, positive.
  string amount = 2;
  // How much of it is taken back from the trip's driver (0 to amount; the
  // platform pays the rest).
  string driver_amount = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message ListTripRefundsRequest {
  string trip_id = 1;
}

message ListTripRefundsResponse {
  repeated Adjustment refunds = 1;
  // The trip's fare (or fee): the most its refunds may add up to; and what
  // is refunded so far.
  string paid_amount = 2;
  string refunded_amount = 3;
}

message TipDriverRequest {
  // The caller's own rider profile.
  string rider_id = 1;
  string trip_id = 2;
  string amount = 3;
  // Required: a retry with the same key is the same tip.
  string idempotency_key = 4;
}

message Tip {
  string id = 1;
  string trip_id = 2;
  string amount = 3;
  string currency_code = 4;
  google.protobuf.Timestamp created_at = 5;
}

message TipDriverResponse {
  Tip tip = 1;
  // The rider's wallet after it.
  Wallet wallet = 2;
}
