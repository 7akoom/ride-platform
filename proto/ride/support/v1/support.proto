syntax = "proto3";

package ride.support.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/support/v1;supportv1";

// SupportService: riders and drivers ask for help in tickets, and support
// staff answer them.
//
// A ticket belongs to the person who opened it, as a rider or as a driver,
// and may name one of their trips or wallet transactions. Messages go back and
// forth; a staff reply reaches the person as a push. Staff may also write
// internal notes the person never sees.
//
// Safety tickets (a safety category, or an SOS raised during a trip) are
// urgent, and only staff with support.safety see them. The other party of
// the trip never sees a ticket about them.
//
// Lost items: a ticket in a lost-item category brings in the trip's driver,
// who is told and can answer inside the same ticket; neither side sees the
// other's phone.
//
// From a ticket, staff may refund a trip, waive a cancellation or no-show fee,
// credit a wallet (support.refund), and suspend or reactivate an account
// (support.suspend). Money above SUPPORT_REFUND_LIMIT for one ticket waits
// for another staff member with support.approve.
service SupportService {
  // ListSupportCategories lists the active categories for riders or drivers,
  // in their display order.
  rpc ListSupportCategories(ListSupportCategoriesRequest) returns (ListSupportCategoriesResponse) {
    option (google.api.http) = {
      get: "/v1/support/categories"
    };
  }
  // CreateTicket opens a ticket as the caller's rider or driver profile. A
  // category that needs a trip needs one of the caller's trips from the last
  // SUPPORT_TRIP_MAX_AGE. An open ticket of the same category about the same
  // trip is returned instead of a second one (existing = true).
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse) {
    option (google.api.http) = {
      post: "/v1/support/tickets"
      body: "*"
    };
  }
  // ListMyTickets lists the caller's tickets as a rider or driver, newest
  // activity first. A driver also sees lost-item tickets about their trips.
  rpc ListMyTickets(ListMyTicketsRequest) returns (ListMyTicketsResponse) {
    option (google.api.http) = {
      get: "/v1/support/tickets"
    };
  }
  // GetMyTicket reads one of the caller's tickets with its messages (internal
  // notes left out).
  rpc GetMyTicket(GetMyTicketRequest) returns (TicketDetailResponse) {
    option (google.api.http) = {
      get: "/v1/support/tickets/{ticket_id}"
    };
  }
  // AddTicketMessage writes in one of the caller's tickets. A message on a
  // resolved ticket reopens it; a closed ticket takes no more messages.
  rpc AddTicketMessage(AddTicketMessageRequest) returns (TicketDetailResponse) {
    option (google.api.http) = {
      post: "/v1/support/tickets/{ticket_id}/messages"
      body: "*"
    };
  }
  // CloseMyTicket: the person who opened the ticket says it is sorted.
  rpc CloseMyTicket(CloseMyTicketRequest) returns (TicketDetailResponse) {
    option (google.api.http) = {
      post: "/v1/support/tickets/{ticket_id}:close"
      body: "*"
    };
  }
  // GetAttachmentURL returns a short-lived link to a file attached to a
  // ticket, for the people in it and for staff who may see the ticket.
  rpc GetAttachmentURL(GetAttachmentURLRequest) returns (GetAttachmentURLResponse) {
    option (google.api.http) = {
      get: "/v1/support/tickets/{ticket_id}/attachments/{media_id}"
    };
  }

  // Staff. support.read: the queue and tickets (safety ones also need
  // support.safety). support.reply: claim, answer, change status and
  // priority. support.manage: assign to someone else. Every call is audited.
  rpc ListSupportQueue(ListSupportQueueRequest) returns (ListSupportQueueResponse) {
    option (google.api.http) = {
      get: "/v1/admin/support/tickets"
    };
  }
  // ListSafetyQueue is the queue of safety tickets. Needs support.safety.
  rpc ListSafetyQueue(ListSupportQueueRequest) returns (ListSupportQueueResponse) {
    option (google.api.http) = {
      get: "/v1/admin/support/safety-tickets"
    };
  }
  rpc GetTicketForStaff(GetTicketForStaffRequest) returns (StaffTicketDetailResponse) {
    option (google.api.http) = {
      get: "/v1/admin/support/tickets/{ticket_id}"
    };
  }
  // ClaimTicket assigns an unassigned ticket to the caller.
  rpc ClaimTicket(ClaimTicketRequest) returns (StaffTicketDetailResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/tickets/{ticket_id}:claim"
      body: "*"
    };
  }
  // AssignTicket gives a ticket to a staff member (empty staff_id: back to
  // the queue). Needs support.manage.
  rpc AssignTicket(AssignTicketRequest) returns (StaffTicketDetailResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/tickets/{ticket_id}:assign"
      body: "*"
    };
  }
  // ReplyToTicket answers the person (or writes an internal note). A reply
  // to an unassigned ticket assigns it to the caller.
  rpc ReplyToTicket(ReplyToTicketRequest) returns (StaffTicketDetailResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/tickets/{ticket_id}/messages"
      body: "*"
    };
  }
  rpc SetTicketStatus(SetTicketStatusRequest) returns (StaffTicketDetailResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/tickets/{ticket_id}:set-status"
      body: "*"
    };
  }
  // SetTicketPriority: a safety ticket stays urgent.
  rpc SetTicketPriority(SetTicketPriorityRequest) returns (StaffTicketDetailResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/tickets/{ticket_id}:set-priority"
      body: "*"
    };
  }
  // RequestTicketAction acts from a ticket: refund, fee waiver and wallet
  // credit need support.refund; suspend and reactivate need support.suspend.
  // Money that takes the ticket over SUPPORT_REFUND_LIMIT waits for approval
  // (status PENDING_APPROVAL) instead of running.
  rpc RequestTicketAction(RequestTicketActionRequest) returns (TicketActionResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/tickets/{ticket_id}/actions"
      body: "*"
    };
  }
  // The approval queue of actions over the limit, oldest first. Needs
  // support.approve.
  rpc ListPendingTicketActions(ListPendingTicketActionsRequest) returns (ListPendingTicketActionsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/support/actions"
    };
  }
  // ApproveTicketAction runs a waiting action. Needs support.approve, and
  // someone other than who asked for it.
  rpc ApproveTicketAction(ApproveTicketActionRequest) returns (TicketActionResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/actions/{action_id}:approve"
      body: "*"
    };
  }
  rpc RejectTicketAction(RejectTicketActionRequest) returns (TicketActionResponse) {
    option (google.api.http) = {
      post: "/v1/admin/support/actions/{action_id}:reject"
      body: "*"
    };
  }
  // Categories. Needs support.configure.
  rpc AdminListSupportCategories(AdminListSupportCategoriesRequest) returns (ListSupportCategoriesResponse) {
    option (google.api.http) = {
      get: "/v1/admin/support/categories"
    };
  }
  rpc UpsertSupportCategory(UpsertSupportCategoryRequest) returns (SupportCategoryResponse) {
    option (google.api.http) = {
      put: "/v1/admin/support/categories/{category.key}"
      body: "*"
    };
  }
}

enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_RIDER = 1;
  AUDIENCE_DRIVER = 2;
}

enum CategoryAudience {
  CATEGORY_AUDIENCE_UNSPECIFIED = 0;
  CATEGORY_AUDIENCE_RIDER = 1;
  CATEGORY_AUDIENCE_DRIVER = 2;
  CATEGORY_AUDIENCE_BOTH = 3;
}

enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  // Waiting for staff.
  TICKET_STATUS_OPEN = 1;
  // A staff member is working on it.
  TICKET_STATUS_IN_PROGRESS = 2;
  // Waiting for the person to answer.
  TICKET_STATUS_WAITING_USER = 3;
  // Sorted; a message from the person reopens it.
  TICKET_STATUS_RESOLVED = 4;
  // Final.
  TICKET_STATUS_CLOSED = 5;
}

enum TicketPriority {
  TICKET_PRIORITY_UNSPECIFIED = 0;
  TICKET_PRIORITY_LOW = 1;
  TICKET_PRIORITY_NORMAL = 2;
  TICKET_PRIORITY_HIGH = 3;
  TICKET_PRIORITY_URGENT = 4;
}

enum TicketSource {
  TICKET_SOURCE_UNSPECIFIED = 0;
  TICKET_SOURCE_APP = 1;
  TICKET_SOURCE_SOS = 2;
}

// How the caller is in a ticket.
enum TicketRole {
  TICKET_ROLE_UNSPECIFIED = 0;
  TICKET_ROLE_REQUESTER = 1;
  // The trip's driver brought into a lost-item ticket.
  TICKET_ROLE_PARTICIPANT = 2;
}

enum MessageAuthor {
  MESSAGE_AUTHOR_UNSPECIFIED = 0;
  MESSAGE_AUTHOR_REQUESTER = 1;
  MESSAGE_AUTHOR_PARTICIPANT = 2;
  MESSAGE_AUTHOR_STAFF = 3;
  // What happened to the ticket (status, assignment, actions); staff only.
  MESSAGE_AUTHOR_SYSTEM = 4;
}

enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  // Give the rider back money for the ticket's trip (wallet RefundTrip).
  ACTION_KIND_REFUND = 1;
  // Waive what is left of the ticket's cancelled trip's fee.
  ACTION_KIND_WAIVE_FEE = 2;
  // Credit the wallet of the person who opened the ticket.
  ACTION_KIND_COMPENSATION = 3;
  ACTION_KIND_SUSPEND_ACCOUNT = 4;
  ACTION_KIND_REACTIVATE_ACCOUNT = 5;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_PENDING_APPROVAL = 1;
  ACTION_STATUS_COMPLETED = 2;
  ACTION_STATUS_REJECTED = 3;
  // It was allowed but the other service refused (reason in failure_reason).
  ACTION_STATUS_FAILED = 4;
  // Allowed and being carried out; a service that did not answer is asked
  // again until it does.
  ACTION_STATUS_PROCESSING = 5;
}

// Whose account a suspend or reactivate is about.
enum ActionTarget {
  ACTION_TARGET_UNSPECIFIED = 0;
  // The person who opened the ticket.
  ACTION_TARGET_REQUESTER = 1;
  // The other side of the ticket's trip.
  ACTION_TARGET_COUNTERPART = 2;
}

message SupportCategory {
  // Stable key: lowercase letters, digits and underscores.
  string key = 1;
  CategoryAudience audience = 2;
  string name_en = 3;
  string name_ar = 4;
  string name_ku = 5;
  TicketPriority default_priority = 6;
  // The ticket must name one of the person's trips.
  bool requires_trip = 7;
  bool safety = 8;
  // Brings the trip's driver into the ticket.
  bool lost_item = 9;
  bool active = 10;
  int32 sort_order = 11;
}

message Attachment {
  string media_id = 1;
  string message_id = 2;
}

message TicketMessage {
  string id = 1;
  MessageAuthor author = 2;
  // Who wrote a staff message; only in staff views.
  string staff_id = 3;
  string body = 4;
  // Only staff see internal notes and system messages.
  bool internal = 5;
  repeated string attachment_media_ids = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Ticket {
  string id = 1;
  // Human reference, e.g. S-000123.
  string number = 2;
  Audience audience = 3;
  string category_key = 4;
  string subject = 5;
  TicketStatus status = 6;
  TicketPriority priority = 7;
  bool safety = 8;
  TicketSource source = 9;
  string trip_id = 10;
  string transaction_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp last_message_at = 14;
  google.protobuf.Timestamp resolved_at = 15;
  google.protobuf.Timestamp closed_at = 16;
  // For the caller's own view.
  TicketRole role = 17;
}

// StaffTicket is a ticket with what only staff see.
message StaffTicket {
  Ticket ticket = 1;
  string requester_identity_id = 2;
  // The rider or driver profile that opened it.
  string requester_profile_id = 3;
  // The other side of the trip (driver for a rider's ticket, rider for a
  // driver's), when there is a trip.
  string counterpart_profile_id = 4;
  // The driver brought into a lost-item ticket.
  string participant_driver_id = 5;
  string assigned_staff_id = 6;
  google.protobuf.Timestamp first_response_at = 7;
  string sos_alert_id = 8;
}

message TicketAction {
  string id = 1;
  string ticket_id = 2;
  ActionKind kind = 3;
  ActionStatus status = 4;
  // Money actions: decimal strings.
  string amount = 5;
  string driver_amount = 6;
  ActionTarget target = 7;
  string target_profile_id = 8;
  string reason = 9;
  string requested_by_staff_id = 10;
  string decided_by_staff_id = 11;
  string decision_reason = 12;
  string failure_reason = 13;
  // A suspension lifted automatically at this time; empty: until reactivated.
  google.protobuf.Timestamp suspend_until = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp decided_at = 16;
  google.protobuf.Timestamp completed_at = 17;
}

message ListSupportCategoriesRequest {
  Audience audience = 1;
}

message ListSupportCategoriesResponse {
  repeated SupportCategory categories = 1;
}

message CreateTicketRequest {
  Audience audience = 1;
  string category_key = 2;
  // Optional, up to 120 characters (the apps show the category's name
  // when it is empty).
  string subject = 3;
  // The first message, 1-4000 characters.
  string body = 4;
  string trip_id = 5;
  string transaction_id = 6;
  // Up to 5 of the caller's READY SUPPORT_ATTACHMENT uploads.
  repeated string attachment_media_ids = 7;
}

message CreateTicketResponse {
  Ticket ticket = 1;
  repeated TicketMessage messages = 2;
  bool existing = 3;
}

message ListMyTicketsRequest {
  Audience audience = 1;
  // Only tickets still open (not resolved or closed).
  bool open_only = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListMyTicketsResponse {
  repeated Ticket tickets = 1;
  string next_page_token = 2;
}

message GetMyTicketRequest {
  string ticket_id = 1;
}

message TicketDetailResponse {
  Ticket ticket = 1;
  repeated TicketMessage messages = 2;
}

message AddTicketMessageRequest {
  string ticket_id = 1;
  string body = 2;
  repeated string attachment_media_ids = 3;
}

message CloseMyTicketRequest {
  string ticket_id = 1;
}

message GetAttachmentURLRequest {
  string ticket_id = 1;
  string media_id = 2;
}

message GetAttachmentURLResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListSupportQueueRequest {
  // Optional filters. No status: everything not resolved or closed.
  TicketStatus status = 1;
  string category_key = 2;
  TicketPriority priority = 3;
  string assigned_staff_id = 4;
  bool unassigned_only = 5;
  Audience audience = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message ListSupportQueueResponse {
  repeated StaffTicket tickets = 1;
  string next_page_token = 2;
}

message GetTicketForStaffRequest {
  string ticket_id = 1;
}

message StaffTicketDetailResponse {
  StaffTicket ticket = 1;
  repeated TicketMessage messages = 2;
  repeated TicketAction actions = 3;
}

message ClaimTicketRequest {
  string ticket_id = 1;
}

message AssignTicketRequest {
  string ticket_id = 1;
  string staff_id = 2;
}

message ReplyToTicketRequest {
  string ticket_id = 1;
  string body = 2;
  // An internal note: only staff see it, nobody is told.
  bool internal = 3;
  // Up to 5 of the caller's READY SUPPORT_ATTACHMENT uploads.
  repeated string attachment_media_ids = 4;
  // Optional: the status the ticket takes after a reply (WAITING_USER,
  // RESOLVED...). A reply that is not internal defaults to WAITING_USER.
  TicketStatus set_status = 5;
}

message SetTicketStatusRequest {
  string ticket_id = 1;
  TicketStatus status = 2;
}

message SetTicketPriorityRequest {
  string ticket_id = 1;
  TicketPriority priority = 2;
}

message RequestTicketActionRequest {
  string ticket_id = 1;
  ActionKind kind = 2;
  // REFUND and COMPENSATION: positive decimal string.
  string amount = 3;
  // REFUND: how much of it is taken back from the trip's driver.
  string driver_amount = 4;
  // SUSPEND_ACCOUNT and REACTIVATE_ACCOUNT.
  ActionTarget target = 5;
  // 3-300 characters.
  string reason = 6;
  // SUSPEND_ACCOUNT: optional, 1 hour to 90 days from now.
  google.protobuf.Timestamp suspend_until = 7;
}

message TicketActionResponse {
  TicketAction action = 1;
}

message ListPendingTicketActionsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListPendingTicketActionsResponse {
  repeated TicketAction actions = 1;
  string next_page_token = 2;
}

message ApproveTicketActionRequest {
  string action_id = 1;
  string reason = 2;
}

message RejectTicketActionRequest {
  string action_id = 1;
  // 3-300 characters.
  string reason = 2;
}

message AdminListSupportCategoriesRequest {}

message UpsertSupportCategoryRequest {
  SupportCategory category = 1;
}

message SupportCategoryResponse {
  SupportCategory category = 1;
}
