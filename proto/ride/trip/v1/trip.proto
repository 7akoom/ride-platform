syntax = "proto3";

package ride.trip.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/trip/v1;tripv1";

service TripService {
  rpc RequestTrip(RequestTripRequest) returns (RequestTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips"
      body: "*"
    };
  }
  rpc AcceptTrip(AcceptTripRequest) returns (AcceptTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:accept"
      body: "*"
    };
  }
  rpc StartTrip(StartTripRequest) returns (StartTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:start"
    };
  }
  rpc CompleteTrip(CompleteTripRequest) returns (CompleteTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:complete"
    };
  }
  rpc CancelTrip(CancelTripRequest) returns (CancelTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:cancel"
      body: "*"
    };
  }
  // GetTrip is the rider/driver app's poll target for live trip status —
  // both the Rider app's tracking screen and the Driver app's active-trip
  // screen call this every few seconds until they see the status they're
  // waiting for (ACCEPTED, then IN_PROGRESS, then COMPLETED).
  rpc GetTrip(GetTripRequest) returns (GetTripResponse) {
    option (google.api.http) = {
      get: "/v1/trips/{trip_id}"
    };
  }

  // TriggerSOS records a safety alert during an active trip — it does
  // NOT replace calling emergency services directly (the app's SOS
  // button dials the local emergency number itself); this is the
  // platform-side record: what trip, who pressed it, and where, so the
  // safety team can pull up the trip (and its path, via GetTripPath)
  // immediately and a notification goes out to the configured safety
  // contact.
  rpc TriggerSOS(TriggerSOSRequest) returns (TriggerSOSResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:sos"
      body: "*"
    };
  }

  // RecordWaypoint appends one point to the trip's path. Called by the
  // driver app on a timer (every ~15-30s) alongside — not instead of —
  // its regular LocationService.UpdateLocation ping; the two are
  // independent so a failure in one never blocks the other. Duplicate
  // calls inside the throttle window are silently absorbed, so the
  // caller doesn't need its own client-side timing logic.
  rpc RecordWaypoint(RecordWaypointRequest) returns (RecordWaypointResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:waypoint"
      body: "*"
    };
  }

  // GetTripPath returns every waypoint recorded for a trip, oldest
  // first — the reconstructed route for a completed trip, or the route
  // so far for one still in progress (e.g. right after an SOS alert).
  rpc GetTripPath(GetTripPathRequest) returns (GetTripPathResponse) {
    option (google.api.http) = {
      get: "/v1/trips/{trip_id}/path"
    };
  }
}

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  TRIP_STATUS_REQUESTED = 1;
  TRIP_STATUS_ACCEPTED = 2;
  TRIP_STATUS_IN_PROGRESS = 3;
  TRIP_STATUS_COMPLETED = 4;
  TRIP_STATUS_CANCELLED = 5;
}

message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

message Trip {
  string id = 1;
  string rider_id = 2;
  string driver_id = 3;
  TripStatus status = 4;
  Coordinates pickup = 5;
  Coordinates dropoff = 6;
  string cancellation_reason = 7;
  google.protobuf.Timestamp requested_at = 8;
  google.protobuf.Timestamp accepted_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  google.protobuf.Timestamp cancelled_at = 12;
  // economy or comfort.
  string vehicle_class = 13;
  // cash or wallet.
  string payment_method = 14;
}

message RequestTripRequest {
  string rider_id = 1;
  Coordinates pickup = 2;
  Coordinates dropoff = 3;
  // economy (default when empty) or comfort.
  string vehicle_class = 4;
  // cash (default when empty) or wallet. card is not supported yet.
  string payment_method = 5;
}

message RequestTripResponse {
  Trip trip = 1;
}

message AcceptTripRequest {
  string trip_id = 1;
  string driver_id = 2;
}

message AcceptTripResponse {
  Trip trip = 1;
}

message StartTripRequest {
  string trip_id = 1;
}

message StartTripResponse {
  Trip trip = 1;
}

message CompleteTripRequest {
  string trip_id = 1;
}

message CompleteTripResponse {
  Trip trip = 1;
}

message CancelTripRequest {
  string trip_id = 1;
  string reason = 2;
}

message CancelTripResponse {
  Trip trip = 1;
}

message GetTripRequest {
  string trip_id = 1;
}

message GetTripResponse {
  Trip trip = 1;
}

// --- Safety: SOS alerts -----------------------------------------------

enum SosTriggeredBy {
  SOS_TRIGGERED_BY_UNSPECIFIED = 0;
  SOS_TRIGGERED_BY_RIDER = 1;
  SOS_TRIGGERED_BY_DRIVER = 2;
}

message TriggerSOSRequest {
  string trip_id = 1;
  SosTriggeredBy triggered_by = 2;
  Coordinates location = 3;
}

message TriggerSOSResponse {
  string alert_id = 1;
  google.protobuf.Timestamp triggered_at = 2;
}

// --- Safety: trip path (waypoints) -------------------------------------

message Waypoint {
  Coordinates location = 1;
  google.protobuf.Timestamp recorded_at = 2;
}

message RecordWaypointRequest {
  string trip_id = 1;
  Coordinates location = 2;
}

// Empty on purpose: a throttled-away duplicate and a freshly recorded
// point both succeed identically — the caller doesn't need to
// distinguish them, so there's nothing worth returning either way.
message RecordWaypointResponse {}

message GetTripPathRequest {
  string trip_id = 1;
}

message GetTripPathResponse {
  repeated Waypoint waypoints = 1;
}

