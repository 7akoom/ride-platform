syntax = "proto3";

package ride.trip.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
option go_package = "github.com/7akoom/ride-platform/gen/go/ride/trip/v1;tripv1";

service TripService {
  rpc RequestTrip(RequestTripRequest) returns (RequestTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips"
      body: "*"
    };
  }
  rpc AcceptTrip(AcceptTripRequest) returns (AcceptTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:accept"
      body: "*"
    };
  }
  rpc StartTrip(StartTripRequest) returns (StartTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:start"
    };
  }
  rpc CompleteTrip(CompleteTripRequest) returns (CompleteTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:complete"
    };
  }
  rpc CancelTrip(CancelTripRequest) returns (CancelTripResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:cancel"
      body: "*"
    };
  }
  // GetTrip is the rider/driver app's poll target for live trip status —
  // both the Rider app's tracking screen and the Driver app's active-trip
  // screen call this every few seconds until they see the status they're
  // waiting for (ACCEPTED, then IN_PROGRESS, then COMPLETED).
  rpc GetTrip(GetTripRequest) returns (GetTripResponse) {
    option (google.api.http) = {
      get: "/v1/trips/{trip_id}"
    };
  }

  // TriggerSOS records a safety alert during an active trip — it does
  // NOT replace calling emergency services directly (the app's SOS
  // button dials the local emergency number itself); this is the
  // platform-side record: what trip, who pressed it, and where, so the
  // safety team can pull up the trip (and its path, via GetTripPath)
  // immediately and a notification goes out to the configured safety
  // contact.
  rpc TriggerSOS(TriggerSOSRequest) returns (TriggerSOSResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:sos"
      body: "*"
    };
  }

  // RecordWaypoint appends one point to the trip's path. Called by the
  // driver app on a timer (every ~15-30s) alongside — not instead of —
  // its regular LocationService.UpdateLocation ping; the two are
  // independent so a failure in one never blocks the other. Duplicate
  // calls inside the throttle window are silently absorbed, so the
  // caller doesn't need its own client-side timing logic.
  rpc RecordWaypoint(RecordWaypointRequest) returns (RecordWaypointResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:waypoint"
      body: "*"
    };
  }

  // GetTripPath returns every waypoint recorded for a trip, oldest
  // first — the reconstructed route for a completed trip, or the route
  // so far for one still in progress (e.g. right after an SOS alert).
  rpc GetTripPath(GetTripPathRequest) returns (GetTripPathResponse) {
    option (google.api.http) = {
      get: "/v1/trips/{trip_id}/path"
    };
  }

  // GetDriverLocation is the Rider app's live-tracking poll target: where the
  // driver of this trip last reported being. Only the trip's rider may ask, and
  // only while the trip is ACCEPTED or IN_PROGRESS (FAILED_PRECONDITION
  // otherwise). It returns the position and when the driver reported it, and
  // nothing else about the driver. NOT_FOUND means the driver has not reported
  // recently (a live position expires after 30 seconds); the app keeps polling.
  rpc GetDriverLocation(GetDriverLocationRequest) returns (GetDriverLocationResponse) {
    option (google.api.http) = {
      get: "/v1/trips/{trip_id}/driver-location"
    };
  }

  // GetActiveTrip is how an app finds the trip it should be showing: the caller's
  // requested, accepted or in-progress trip, for example when the app is opened
  // again after being closed. Name exactly one of rider_id and driver_id, and it
  // must be the caller's own profile. NOT_FOUND means there is no active trip.
  rpc GetActiveTrip(GetActiveTripRequest) returns (GetActiveTripResponse) {
    option (google.api.http) = {
      get: "/v1/trips:active"
    };
  }

  // ListTrips is the caller's trip history, newest first, one page at a time. Name
  // exactly one of rider_id and driver_id, and it must be the caller's own profile.
  // Pass the previous page's next_page_token to get the following page; an empty
  // next_page_token means that was the last one.
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse) {
    option (google.api.http) = {
      get: "/v1/trips"
    };
  }

  // OfferTrip puts a trip to one driver for a short time: ttl_seconds (default 15,
  // clamped to 5-60). Internal: only dispatch calls it. A driver is offered a trip
  // at most once, so dispatch needs no memory of who it already asked. The refusals
  // tell dispatch what to do: ALREADY_EXISTS (this driver was offered it before)
  // and FAILED_PRECONDITION (the driver has a pending offer or a trip, or the trip
  // is no longer waiting) mean try the next driver; ABORTED means another driver
  // has a live offer for this trip, so wait for it to be answered or to expire.
  rpc OfferTrip(OfferTripRequest) returns (OfferTripResponse);

  // GetPendingOffer is the Driver app's poll target: the trip it is being offered,
  // with what it needs to decide (where from and to, vehicle class, payment method,
  // when the offer ends), or NOT_FOUND when there is none. It does not say who the
  // rider is. driver_id must be the caller's own driver profile.
  rpc GetPendingOffer(GetPendingOfferRequest) returns (GetPendingOfferResponse) {
    option (google.api.http) = {
      get: "/v1/drivers/{driver_id}/offer"
    };
  }

  // AcceptOffer makes the caller the driver of the trip: the offer and the trip
  // change together (the trip goes from REQUESTED to ACCEPTED). NOT_FOUND: there
  // is no live offer of this trip to this driver. FAILED_PRECONDITION: the offer
  // expired, the trip was cancelled meanwhile, or the driver is on another trip.
  // driver_id must be the caller's own driver profile.
  rpc AcceptOffer(AcceptOfferRequest) returns (AcceptOfferResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:accept-offer"
      body: "*"
    };
  }

  // RejectOffer declines the offer; the trip goes on to the next driver, and this
  // driver is not offered it again. driver_id must be the caller's own profile.
  rpc RejectOffer(RejectOfferRequest) returns (RejectOfferResponse) {
    option (google.api.http) = {
      post: "/v1/trips/{trip_id}:reject-offer"
      body: "*"
    };
  }
}

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  TRIP_STATUS_REQUESTED = 1;
  TRIP_STATUS_ACCEPTED = 2;
  TRIP_STATUS_IN_PROGRESS = 3;
  TRIP_STATUS_COMPLETED = 4;
  TRIP_STATUS_CANCELLED = 5;
}

message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

message Trip {
  string id = 1;
  string rider_id = 2;
  string driver_id = 3;
  TripStatus status = 4;
  Coordinates pickup = 5;
  Coordinates dropoff = 6;
  string cancellation_reason = 7;
  google.protobuf.Timestamp requested_at = 8;
  google.protobuf.Timestamp accepted_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  google.protobuf.Timestamp cancelled_at = 12;
  // economy or comfort.
  string vehicle_class = 13;
  // cash or wallet.
  string payment_method = 14;
}

message RequestTripRequest {
  string rider_id = 1;
  Coordinates pickup = 2;
  Coordinates dropoff = 3;
  // economy (default when empty) or comfort.
  string vehicle_class = 4;
  // cash (default when empty) or wallet. card is not supported yet.
  string payment_method = 5;
}

message RequestTripResponse {
  Trip trip = 1;
}

message AcceptTripRequest {
  string trip_id = 1;
  string driver_id = 2;
}

message AcceptTripResponse {
  Trip trip = 1;
}

message StartTripRequest {
  string trip_id = 1;
}

message StartTripResponse {
  Trip trip = 1;
}

message CompleteTripRequest {
  string trip_id = 1;
}

message CompleteTripResponse {
  Trip trip = 1;
}

message CancelTripRequest {
  string trip_id = 1;
  string reason = 2;
}

message CancelTripResponse {
  Trip trip = 1;
}

message GetTripRequest {
  string trip_id = 1;
}

message GetTripResponse {
  Trip trip = 1;
}

// --- Safety: SOS alerts -----------------------------------------------

enum SosTriggeredBy {
  SOS_TRIGGERED_BY_UNSPECIFIED = 0;
  SOS_TRIGGERED_BY_RIDER = 1;
  SOS_TRIGGERED_BY_DRIVER = 2;
}

message TriggerSOSRequest {
  string trip_id = 1;
  SosTriggeredBy triggered_by = 2;
  Coordinates location = 3;
}

message TriggerSOSResponse {
  string alert_id = 1;
  google.protobuf.Timestamp triggered_at = 2;
}

// --- Safety: trip path (waypoints) -------------------------------------

message Waypoint {
  Coordinates location = 1;
  google.protobuf.Timestamp recorded_at = 2;
}

message RecordWaypointRequest {
  string trip_id = 1;
  Coordinates location = 2;
}

// Empty on purpose: a throttled-away duplicate and a freshly recorded
// point both succeed identically — the caller doesn't need to
// distinguish them, so there's nothing worth returning either way.
message RecordWaypointResponse {}

message GetTripPathRequest {
  string trip_id = 1;
}

message GetTripPathResponse {
  repeated Waypoint waypoints = 1;
}


// --- Rider tracking: the driver's live position -----------------------

message GetDriverLocationRequest {
  string trip_id = 1;
}

message GetDriverLocationResponse {
  Coordinates location = 1;
  // When the driver's phone last reported this position.
  google.protobuf.Timestamp updated_at = 2;
}

// --- Trip history: the active trip and the trip list ------------------

message GetActiveTripRequest {
  // Exactly one of the two, and it must be the caller's own profile.
  string rider_id = 1;
  string driver_id = 2;
}

message GetActiveTripResponse {
  Trip trip = 1;
}

message ListTripsRequest {
  // Exactly one of the two, and it must be the caller's own profile.
  string rider_id = 1;
  string driver_id = 2;
  // 1 to 50, default 20; a larger value is served as 50.
  int32 page_size = 3;
  // The next_page_token of the previous page; empty for the first page.
  string page_token = 4;
}

message ListTripsResponse {
  // Newest first.
  repeated Trip trips = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// --- Driver offers: a trip put to one driver at a time ----------------

// TripOffer is what a driver sees to decide. The rider is not identified.
message TripOffer {
  string trip_id = 1;
  Coordinates pickup = 2;
  Coordinates dropoff = 3;
  string vehicle_class = 4;
  string payment_method = 5;
  google.protobuf.Timestamp offered_at = 6;
  // The last moment the driver can accept.
  google.protobuf.Timestamp expires_at = 7;
}

message OfferTripRequest {
  string trip_id = 1;
  string driver_id = 2;
  // 0 means the default (15); anything else is served within 5 to 60.
  int32 ttl_seconds = 3;
}

message OfferTripResponse {
  string trip_id = 1;
  string driver_id = 2;
  google.protobuf.Timestamp offered_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message GetPendingOfferRequest {
  string driver_id = 1;
}

message GetPendingOfferResponse {
  TripOffer offer = 1;
}

message AcceptOfferRequest {
  string trip_id = 1;
  string driver_id = 2;
}

message AcceptOfferResponse {
  Trip trip = 1;
}

message RejectOfferRequest {
  string trip_id = 1;
  string driver_id = 2;
}

message RejectOfferResponse {}
