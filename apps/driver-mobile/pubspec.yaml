name: driver_app
description: Ride Platform — Driver app (Flutter)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  maplibre_gl: ^0.25.0
  dio: ^5.5.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  # The phone's GPS. The range lets pub pick the newest version that works with the
  # installed Flutter (version 14 needs Flutter 3.29 or newer).
  geolocator: ">=12.0.0 <15.0.0"
  # Keeps the screen on while the driver is online, so the position keeps being reported.
  wakelock_plus: ">=1.2.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
