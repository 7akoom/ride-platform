version: v2

plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative

  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative

  - local: protoc-gen-grpc-gateway
    out: gen/go
    opt:
      - paths=source_relative

  - local: protoc-gen-openapiv2
    out: gen/openapiv2
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=ride_platform
